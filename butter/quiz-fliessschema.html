<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fliessschema Butterherstellung - Quiz</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .level-bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:1.1rem; justify-content:center; width:100%; }
    .level-btn {
      font-family:var(--font); font-size:0.82rem; font-weight:600;
      padding:7px 16px; border-radius:20px; border:1.5px solid var(--border);
      background:var(--surface); color:var(--text-muted); cursor:pointer; transition:all 0.15s;
    }
    .level-btn:hover { border-color:var(--blue-dark); color:var(--blue-dark); }
    .level-btn.active { background:var(--blue-dark); border-color:var(--blue-dark); color:#fff; }

    .quiz-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 56px;
      max-width: 560px;
      margin: 0 auto;
    }

    .score-bar {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
      justify-content: center;
    }
    .score-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .score-number {
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1;
    }
    .score-label {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-subtle);
    }
    .score-correct { color: #38a169; }
    .score-wrong   { color: var(--red); }
    .score-serie   { color: var(--blue-dark); }

    .progress-text {
      font-size: 0.82rem;
      color: var(--text-subtle);
      margin-bottom: 6px;
      text-align: center;
      width: 100%;
    }
    .progress-bar-wrap {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .question-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 28px;
      width: 100%;
      margin-bottom: 14px;
    }
    .question-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 14px;
      background: #dcfce7;
      color: #15803d;
    }
    .question-text {
      font-size: 1.0rem;
      font-weight: 600;
      line-height: 1.55;
      color: var(--text);
      margin-bottom: 20px;
    }

    .answers {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .answer-btn {
      font-family: var(--font);
      font-size: 0.88rem;
      font-weight: 500;
      text-align: left;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      line-height: 1.4;
    }
    .answer-btn:hover:not(:disabled) {
      border-color: var(--blue-light);
      background: var(--blue-tint);
    }
    .answer-btn.correct {
      border-color: #38a169;
      background: #dcfce7;
      color: #15803d;
      font-weight: 600;
    }
    .answer-btn.wrong {
      border-color: var(--red);
      background: var(--red-light);
      color: var(--red-dark);
    }
    .answer-btn:disabled { cursor: default; }

    .feedback {
      width: 100%;
      border-radius: var(--radius-md);
      padding: 14px 18px;
      font-size: 0.88rem;
      line-height: 1.55;
      display: none;
      margin-bottom: 14px;
    }
    .feedback.correct {
      background: #dcfce7;
      border: 1px solid #86efac;
      color: #15803d;
      display: block;
    }
    .feedback.wrong {
      background: var(--red-light);
      border: 1px solid #fca5a5;
      color: #991b1b;
      display: block;
    }
    .feedback-title {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .quiz-nav {
      width: 100%;
      display: flex;
      justify-content: flex-end;
    }

    .end-screen {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 40px 28px;
      width: 100%;
      text-align: center;
      display: none;
    }
    .end-screen.visible { display: block; }
    .end-big {
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--blue-dark);
      margin-bottom: 8px;
    }
    .end-text {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.55;
    }
  </style>
</head>
<body>

<header class="bzwu-header">
  <div class="header-text">
    <span class="school-badge">BZWU Wil-Uzwil · Milchpraktiker EBA · Butter</span>
    <h1>Fliessschema Butterherstellung - Quiz</h1>
    <p>Wählen Sie die richtige Antwort. Sie erhalten sofort eine Rückmeldung.</p>
  </div>
  <div class="header-logos">
    <img src="../assets/logos/bzwu.png" alt="BZWU" class="header-logo">
    <img src="../assets/logos/milchtechnologen.svg" alt="Milchtechnologen" class="header-logo">
  </div>
</header>

<main>
<div class="quiz-wrap">
  <a class="back-link" href="../index.html">&#8592; Alle Lerntools</a>

  <div class="level-bar">
    <button class="level-btn active" id="lvl-einfach" onclick="setLevel('einfach')">Einfach</button>
    <button class="level-btn"        id="lvl-schwer"  onclick="setLevel('schwer')">Schwer</button>
  </div>

  <div class="score-bar">
    <div class="score-item">
      <span class="score-number score-correct" id="scoreCorrect">0</span>
      <span class="score-label">Richtig</span>
    </div>
    <div class="score-item">
      <span class="score-number score-wrong" id="scoreWrong">0</span>
      <span class="score-label">Falsch</span>
    </div>
    <div class="score-item">
      <span class="score-number score-serie" id="scoreSerie">0</span>
      <span class="score-label">Serie</span>
    </div>
  </div>

  <div class="progress-text" id="progressText"></div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar"></div>
  </div>

  <div class="question-card" id="questionCard">
    <span class="question-badge">Fliessschema</span>
    <div class="question-text" id="questionText"></div>
    <div class="answers" id="answers"></div>
  </div>

  <div class="feedback" id="feedback">
    <div class="feedback-title" id="feedbackTitle"></div>
    <div id="feedbackText"></div>
  </div>

  <div class="quiz-nav" id="quizNav" style="display:none;">
    <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">Weiter &#8594;</button>
  </div>

  <div class="end-screen" id="endScreen">
    <div class="end-big" id="endScore"></div>
    <div class="end-text" id="endText"></div>
    <button class="btn btn-primary" onclick="restartQuiz()">Nochmals versuchen</button>
  </div>

</div>
</main>

<script src="../assets/quiz-engine.js"></script>
<script>
var EASY_QUESTIONS = [
  { q: 'Was ist der 1. Schritt im Fliessschema?',
    options: ['Butterfertiger füllen', 'Rahmtemperatur einstellen', 'Butterkorn herstellen', 'Buttermilch ablassen'],
    correct: 1,
    explanation: 'Der 1. Schritt im Fliessschema ist die Rahmtemperatur einstellen.'
  },
  { q: 'Was passiert direkt nach "Butterkorn herstellen"?',
    options: ['Buttermilch ablassen', 'Ausformen und verpacken', 'Lagern', 'Rahmtemperatur einstellen'],
    correct: 0,
    explanation: 'Nach dem Herstellen des Butterkorns wird die Buttermilch abgelassen.'
  },
  { q: 'Was kommt nach "Buttermilch ablassen"?',
    options: ['Butterkörner kühlen', 'Rahmtemperatur einstellen', 'Verpacken', 'Lagern'],
    correct: 0,
    explanation: 'Nach dem Ablassen der Buttermilch werden die Butterkörner gekühlt.'
  },
  { q: 'Welcher Knet-Schritt kommt im Fliessschema zuerst?',
    options: ['Nach- oder Trockenkneten', 'Vor- oder Nasskneten', 'Beide gleichzeitig', 'Keiner von beiden'],
    correct: 1,
    explanation: 'Zuerst kommt das Vor- oder Nasskneten, danach das Nach- oder Trockenkneten.'
  },
  { q: 'Was kommt im Fliessschema nach dem Kneten?',
    options: ['Ausformen und verpacken', 'Rahmtemperatur einstellen', 'Butterkorn herstellen', 'Buttermilch ablassen'],
    correct: 0,
    explanation: 'Nach dem Kneten folgt das Ausformen und Verpacken.'
  },
  { q: 'Was ist der letzte Schritt im Fliessschema?',
    options: ['Verpacken', 'Lagern', 'Kneten', 'Buttermilch ablassen'],
    correct: 1,
    explanation: 'Der letzte Schritt im Fliessschema ist das Lagern (unter 5°C).'
  },
  { q: 'Wie viele Schritte umfasst das Fliessschema von "Rahmtemperatur einstellen" bis "Lagern"?',
    options: ['5', '7', '9', '12'],
    correct: 2,
    explanation: 'Das Fliessschema umfasst 9 Schritte von der Rahmtemperatur bis zum Lagern.'
  }
];

var HARD_QUESTIONS = [
  { q: 'Was ist der erste Schritt im Fliessschema, nachdem der Rahm bereit ist?',
    options: ['Butterfertiger füllen', 'Rahmtemperatur einstellen', 'Butterkorn herstellen', 'Buttermilch ablassen'],
    correct: 1,
    explanation: 'Zuerst wird die Rahmtemperatur eingestellt. Erst danach wird der Butterfertiger gefüllt.'
  },
  { q: 'Welche Vorbereitung muss beim Rahm bereits abgeschlossen sein, bevor er ins Fliessschema der Butterherstellung kommt?',
    options: ['Pasteurisieren und Verpacken', 'Physikalische Rahmreifung und ggf. mikrobiologische Rahmreifung/KWK-Verfahren', 'Kneten und Ausformen', 'Lagern und Kühlen'],
    correct: 1,
    explanation: 'Der Rahm muss vorher physikalisch (und ggf. mikrobiologisch, z.B. im KWK-Verfahren) gereift sein. Sonst kann später keine Butter entstehen.'
  },
  { q: 'Was passiert direkt nach "Butterkorn herstellen"?',
    options: ['Buttermilch ablassen', 'Ausformen und verpacken', 'Rahmtemperatur einstellen', 'Lagern'],
    correct: 0,
    explanation: 'Nach dem Herstellen des Butterkorns wird die Buttermilch abgelassen.'
  },
  { q: 'In welcher Reihenfolge kommen die zwei Knet-Schritte im Fliessschema vor?',
    options: ['Zuerst Nach- oder Trockenkneten, dann Vor- oder Nasskneten', 'Zuerst Vor- oder Nasskneten, dann Nach- oder Trockenkneten', 'Beide gleichzeitig', 'Kneten kommt vor dem Kühlen'],
    correct: 1,
    explanation: 'Zuerst kommt das Vor- oder Nasskneten, danach das Nach- oder Trockenkneten.'
  },
  { q: 'Was kommt im Fliessschema direkt vor dem Kneten?',
    options: ['Butterkörner kühlen', 'Ausformen', 'Lagern', 'Rahmtemperatur einstellen'],
    correct: 0,
    explanation: 'Die Butterkörner werden zuerst gekühlt. Erst danach wird geknetet.'
  },
  { q: 'Ein Mitarbeiter verpackt die Butter, bevor sie geknetet wurde. Was ist daran falsch?',
    options: ['Nichts, das ist die richtige Reihenfolge', 'Das Kneten muss laut Fliessschema vor dem Ausformen und Verpacken passieren', 'Die Reihenfolge spielt keine Rolle', 'Verpacken kommt immer zuerst'],
    correct: 1,
    explanation: 'Im Fliessschema kommt das Kneten (Vor- und Nachkneten) vor dem Ausformen und Verpacken.'
  },
  { q: 'Was ist der letzte Schritt im Fliessschema, bevor aus dem Rahm fertige Butter geworden ist?',
    options: ['Butterkorn herstellen', 'Lagern', 'Buttermilch ablassen', 'Rahmtemperatur einstellen'],
    correct: 1,
    explanation: 'Der letzte Schritt ist das Lagern (unter 5°C). Danach ist die Butter fertig.'
  },
  { q: 'Warum kann man sagen, dass das KWK-Verfahren "vor" dem eigentlichen Fliessschema der Butterherstellung abläuft?',
    options: ['Weil KWK die Rahmreifung vor dem Einfüllen in den Butterfertiger übernimmt', 'Weil KWK erst nach dem Verpacken beginnt', 'Weil KWK dasselbe ist wie Kneten', 'Weil KWK nur beim Lagern verwendet wird'],
    correct: 0,
    explanation: 'Das KWK-Verfahren bereitet den Rahm vor (physikalische und ggf. mikrobiologische Rahmreifung). Erst danach beginnt das Fliessschema mit "Rahmtemperatur einstellen".'
  }
];

QuizEngine.init({
  levels: { einfach: EASY_QUESTIONS, schwer: HARD_QUESTIONS },
  messages: {
    excellent: 'Ausgezeichnet! Sie kennen das Fliessschema sehr gut.',
    good: 'Gut gemacht! Noch ein paar Fragen üben und Sie sind top.',
    ok: 'Nicht schlecht. Schauen Sie das Fliessschema nochmals an.',
    poor: 'Schauen Sie das Fliessschema nochmals an. Dann klappt es besser.'
  }
});
</script>
<footer class="bzwu-footer">
  BZWU Wil-Uzwil · Milchpraktiker EBA · Philipp Neukomm
</footer>

</body>
</html>
