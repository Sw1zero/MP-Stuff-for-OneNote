<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Physikalische Rahmreifung + KWK-Verfahren - Quiz</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .level-bar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:1.1rem; justify-content:center; width:100%; }
    .level-btn {
      font-family:var(--font); font-size:0.82rem; font-weight:600;
      padding:7px 16px; border-radius:20px; border:1.5px solid var(--border);
      background:var(--surface); color:var(--text-muted); cursor:pointer; transition:all 0.15s;
    }
    .level-btn:hover { border-color:var(--blue-dark); color:var(--blue-dark); }
    .level-btn.active { background:var(--blue-dark); border-color:var(--blue-dark); color:#fff; }

    .quiz-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 56px;
      max-width: 560px;
      margin: 0 auto;
    }

    .score-bar {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
      justify-content: center;
    }
    .score-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .score-number {
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1;
    }
    .score-label {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-subtle);
    }
    .score-correct { color: #38a169; }
    .score-wrong   { color: var(--red); }
    .score-serie   { color: var(--blue-dark); }

    .progress-text {
      font-size: 0.82rem;
      color: var(--text-subtle);
      margin-bottom: 6px;
      text-align: center;
      width: 100%;
    }
    .progress-bar-wrap {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .question-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 28px;
      width: 100%;
      margin-bottom: 14px;
    }
    .question-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 14px;
      background: #dcfce7;
      color: #15803d;
    }
    .question-text {
      font-size: 1.0rem;
      font-weight: 600;
      line-height: 1.55;
      color: var(--text);
      margin-bottom: 20px;
    }

    .answers {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .answer-btn {
      font-family: var(--font);
      font-size: 0.88rem;
      font-weight: 500;
      text-align: left;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      line-height: 1.4;
    }
    .answer-btn:hover:not(:disabled) {
      border-color: var(--blue-light);
      background: var(--blue-tint);
    }
    .answer-btn.correct {
      border-color: #38a169;
      background: #dcfce7;
      color: #15803d;
      font-weight: 600;
    }
    .answer-btn.wrong {
      border-color: var(--red);
      background: var(--red-light);
      color: var(--red-dark);
    }
    .answer-btn:disabled { cursor: default; }

    .feedback {
      width: 100%;
      border-radius: var(--radius-md);
      padding: 14px 18px;
      font-size: 0.88rem;
      line-height: 1.55;
      display: none;
      margin-bottom: 14px;
    }
    .feedback.correct {
      background: #dcfce7;
      border: 1px solid #86efac;
      color: #15803d;
      display: block;
    }
    .feedback.wrong {
      background: var(--red-light);
      border: 1px solid #fca5a5;
      color: #991b1b;
      display: block;
    }
    .feedback-title {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .quiz-nav {
      width: 100%;
      display: flex;
      justify-content: flex-end;
    }

    .end-screen {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 40px 28px;
      width: 100%;
      text-align: center;
      display: none;
    }
    .end-screen.visible { display: block; }
    .end-big {
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--blue-dark);
      margin-bottom: 8px;
    }
    .end-text {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.55;
    }
  </style>
</head>
<body>

<header class="bzwu-header">
  <div class="header-text">
    <span class="school-badge">BZWU Wil-Uzwil · Milchpraktiker EBA · Butter</span>
    <h1>Physikalische Rahmreifung + KWK-Verfahren - Quiz</h1>
    <p>Wählen Sie die richtige Antwort. Sie erhalten sofort eine Rückmeldung.</p>
  </div>
  <div class="header-logos">
    <img src="../assets/logos/bzwu.png" alt="BZWU" class="header-logo">
    <img src="../assets/logos/milchtechnologen.svg" alt="Milchtechnologen" class="header-logo">
  </div>
</header>

<main>
<div class="quiz-wrap">
  <a class="back-link" href="../index.html">&#8592; Alle Lerntools</a>

  <div class="level-bar">
    <button class="level-btn active" id="lvl-einfach" onclick="setLevel('einfach')">Einfach</button>
    <button class="level-btn"        id="lvl-schwer"  onclick="setLevel('schwer')">Schwer</button>
  </div>

  <div class="score-bar">
    <div class="score-item">
      <span class="score-number score-correct" id="scoreCorrect">0</span>
      <span class="score-label">Richtig</span>
    </div>
    <div class="score-item">
      <span class="score-number score-wrong" id="scoreWrong">0</span>
      <span class="score-label">Falsch</span>
    </div>
    <div class="score-item">
      <span class="score-number score-serie" id="scoreSerie">0</span>
      <span class="score-label">Serie</span>
    </div>
  </div>

  <div class="progress-text" id="progressText"></div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar"></div>
  </div>

  <div class="question-card" id="questionCard">
    <span class="question-badge">Rahmreifung / KWK</span>
    <div class="question-text" id="questionText"></div>
    <div class="answers" id="answers"></div>
  </div>

  <div class="feedback" id="feedback">
    <div class="feedback-title" id="feedbackTitle"></div>
    <div id="feedbackText"></div>
  </div>

  <div class="quiz-nav" id="quizNav" style="display:none;">
    <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">Weiter &#8594;</button>
  </div>

  <div class="end-screen" id="endScreen">
    <div class="end-big" id="endScore"></div>
    <div class="end-text" id="endText"></div>
    <button class="btn btn-primary" onclick="restartQuiz()">Nochmals versuchen</button>
  </div>

</div>
</main>

<script>
var EASY_QUESTIONS = [
  { q: 'Was passiert bei der physikalischen Rahmreifung mit dem Milchfett?',
    options: ['Es wird angesäuert', 'Es wird kristallisiert', 'Es wird verflüssigt', 'Es wird entfernt'],
    correct: 1,
    explanation: 'Bei der physikalischen Rahmreifung wird das Milchfett kristallisiert.'
  },
  { q: 'Wie lange dauert die physikalische Rahmreifung mindestens?',
    options: ['1 Stunde', '6 Stunden', '24 Stunden', '48 Stunden'],
    correct: 1,
    explanation: 'Die physikalische Rahmreifung dauert mindestens 6 Stunden.'
  },
  { q: 'Welche Temperatur braucht die physikalische Rahmreifung im Sommer?',
    options: ['5-8°C', '15-20°C', '20-24°C', '30-35°C'],
    correct: 0,
    explanation: 'Im Sommer braucht die physikalische Rahmreifung eine Temperatur von 5-8°C.'
  },
  { q: 'Wofür steht KWK?',
    options: ['Kalt-Warm-Kalt', 'Kühl-Wasch-Kühl', 'Kultur-Wasser-Konzentrat', 'Kalt-Wasser-Kontrolle'],
    correct: 0,
    explanation: 'KWK steht für Kalt-Warm-Kalt.'
  },
  { q: 'Wie viele Phasen hat das KWK-Verfahren?',
    options: ['2', '3', '4', '5'],
    correct: 1,
    explanation: 'Das KWK-Verfahren hat drei Phasen: Kalt, Warm, Kalt.'
  },
  { q: 'Welche Temperatur hat die 1. Phase (Kalt) beim KWK-Verfahren?',
    options: ['ca. 5°C', 'ca. 10°C', 'ca. 20°C', 'ca. 30°C'],
    correct: 0,
    explanation: 'Die 1. Phase (Kalt) hat ca. 5°C. Die Fettkügelchen erstarren.'
  },
  { q: 'Welche Temperatur hat die 2. Phase (Warm) beim KWK-Verfahren?',
    options: ['ca. 5°C', 'ca. 10°C', 'ca. 20°C', 'ca. 30°C'],
    correct: 2,
    explanation: 'Die 2. Phase (Warm) hat ca. 20°C. Viele Fettmoleküle werden wieder flüssig.'
  },
  { q: 'Welchen Vorteil hat das KWK-Verfahren?',
    options: ['Weichere, streichfähigere Butter', 'Mehr Buttermilch', 'Kürzere Haltbarkeit', 'Weniger Fett in der Butter'],
    correct: 0,
    explanation: 'Das KWK-Verfahren führt zu weicherer, streichfähigerer Butter und einer leicht höheren Ausbeute.'
  }
];

var HARD_QUESTIONS = [
  { q: 'Was unterscheidet die physikalische von der mikrobiologischen Rahmreifung?',
    options: ['Physikalisch kristallisiert das Fett, mikrobiologisch säuern Bakterien den Rahm an', 'Physikalisch säuert der Rahm, mikrobiologisch kristallisiert das Fett', 'Beide kristallisieren das Fett', 'Beide säuern den Rahm an'],
    correct: 0,
    explanation: 'Bei der physikalischen Rahmreifung kristallisiert das Milchfett. Bei der mikrobiologischen Rahmreifung säuern Bakterien den Rahm an. Das sind zwei unterschiedliche Vorgänge.'
  },
  { q: 'Warum ist die physikalische Rahmreifung notwendig?',
    options: ['Damit der Rahm sauer wird', 'Damit anschliessend Butter entstehen kann', 'Damit der Rahm länger haltbar ist', 'Damit die Buttermilch entsteht'],
    correct: 1,
    explanation: 'Durch die Kristallisation des Milchfetts kann anschliessend Butter entstehen. Ohne physikalische Rahmreifung geht das nicht.'
  },
  { q: 'Was passiert bei einer korrekten physikalischen Rahmreifung mit der Butterausbeute?',
    options: ['Sie wird tiefer', 'Sie wird höher', 'Sie bleibt gleich', 'Es entsteht keine Buttermilch mehr'],
    correct: 1,
    explanation: 'Bei einer korrekten physikalischen Rahmreifung ist die Butterausbeute höher. Es geht weniger Fett in der Buttermilch verloren.'
  },
  { q: 'Warum müssen die Parameter der physikalischen Rahmreifung an die Jahreszeit angepasst werden?',
    options: ['Weil im Winter weniger Rahm anfällt', 'Weil der Rahm je nach Saison und Fütterung unterschiedlich viele flüssige Fettsäuren hat', 'Weil im Sommer keine Kühlung möglich ist', 'Weil die Bakterien im Winter schneller wachsen'],
    correct: 1,
    explanation: 'Je nach Saison und Fütterung hat der Rahm einen unterschiedlichen Anteil an flüssigen Fettsäuren. Darum passt man Temperatur und Dauer an.'
  },
  { q: 'Wofür steht KWK?',
    options: ['Kalt-Warm-Kalt', 'Kühlung-Wärme-Kontrolle', 'Kultur-Wasser-Kühlung', 'Kalt-Wasser-Konzentrat'],
    correct: 0,
    explanation: 'KWK steht für Kalt-Warm-Kalt. Das Verfahren hat drei Phasen mit unterschiedlichen Temperaturen.'
  },
  { q: 'Welchen Vorteil hat das KWK-Verfahren gegenüber der reinen physikalischen Rahmreifung?',
    options: ['Weichere, streichfähigere Butter und leicht höhere Ausbeute', 'Weniger Fett in der Butter', 'Kürzere Haltbarkeit', 'Mehr Buttermilch'],
    correct: 0,
    explanation: 'Das KWK-Verfahren führt zu weicherer, streichfähigerer Butter und einer leicht höheren Ausbeute.'
  },
  { q: 'In welcher Phase des KWK-Verfahrens werden viele Fettmoleküle wieder flüssig?',
    options: ['1. Phase (Kalt)', '2. Phase (Warm)', '3. Phase (Kalt)', 'In keiner Phase'],
    correct: 1,
    explanation: 'In der 2. Phase (Warm, ca. 20°C) werden viele Fettmoleküle wieder flüssig.'
  },
  { q: 'Welcher zusätzliche Schritt kann in der 2. Phase (Warm) des KWK-Verfahrens durchgeführt werden?',
    options: ['Die Buttermilch ablassen', 'Die mikrobiologische Rahmreifung', 'Das Ausformen der Butter', 'Die Verpackung'],
    correct: 1,
    explanation: 'In der warmen Phase (ca. 20°C) kann auch die mikrobiologische Rahmreifung durchgeführt werden. Das spart einen separaten Schritt.'
  },
  { q: 'Ihr Betrieb will weichere Butter und möchte die mikrobiologische Rahmreifung ohne separaten Schritt einbauen. Welches Verfahren passt am besten?',
    options: ['Nur physikalische Rahmreifung', 'Das KWK-Verfahren', 'Nur mikrobiologische Rahmreifung', 'Keines der Verfahren'],
    correct: 1,
    explanation: 'Das KWK-Verfahren macht die Butter weicher und streichfähiger. Zusätzlich kann die mikrobiologische Rahmreifung direkt in der 2. Phase (Warm) durchgeführt werden.'
  },
  { q: 'Was passiert in der 3. Phase (Kalt) des KWK-Verfahrens mit den Fettmolekülen?',
    options: ['Sie werden alle flüssig', 'Die festen Fettmoleküle erstarren am Rand und schliessen die flüssigen Moleküle ein', 'Sie verschwinden', 'Sie werden zu Buttermilch'],
    correct: 1,
    explanation: 'In der 3. Phase erstarren die festen Fettmoleküle am Rand und schliessen die flüssigen Moleküle ein.'
  }
];

var level = 'einfach';
var deck = [];
var currentIndex = 0;
var answered = false;
var scoreCorrect = 0;
var scoreWrong = 0;
var scoreSerie = 0;

function buildDeck() {
  var source = (level === 'schwer') ? HARD_QUESTIONS : EASY_QUESTIONS;
  deck = source.slice();
  for (var i = deck.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = deck[i]; deck[i] = deck[j]; deck[j] = tmp;
  }
}

function setLevel(l) {
  level = l;
  document.getElementById('lvl-einfach').classList.toggle('active', l === 'einfach');
  document.getElementById('lvl-schwer').classList.toggle('active', l === 'schwer');
  resetQuiz();
}

function resetQuiz() {
  scoreCorrect = 0;
  scoreWrong = 0;
  scoreSerie = 0;
  updateScoreBar();
  buildDeck();
  currentIndex = 0;
  document.getElementById('endScreen').classList.remove('visible');
  document.getElementById('questionCard').style.display = '';
  document.getElementById('progressText').style.display = '';
  document.getElementById('progressBar').parentElement.style.display = '';
  showQuestion();
}

function restartQuiz() {
  resetQuiz();
}

function updateScoreBar() {
  document.getElementById('scoreCorrect').textContent = scoreCorrect;
  document.getElementById('scoreWrong').textContent = scoreWrong;
  document.getElementById('scoreSerie').textContent = scoreSerie;
}

function showQuestion() {
  answered = false;
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('quizNav').style.display = 'none';

  var q = deck[currentIndex];
  document.getElementById('questionText').textContent = q.q;

  var answersDiv = document.getElementById('answers');
  answersDiv.innerHTML = '';

  var indices = [0, 1, 2, 3];
  for (var i = indices.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = indices[i]; indices[i] = indices[j]; indices[j] = tmp;
  }

  for (var k = 0; k < indices.length; k++) {
    (function(optIdx) {
      var btn = document.createElement('button');
      btn.className = 'answer-btn';
      btn.textContent = q.options[optIdx];
      btn.onclick = function() { checkAnswer(optIdx); };
      answersDiv.appendChild(btn);
    })(indices[k]);
  }

  var total = deck.length;
  document.getElementById('progressText').textContent = 'Frage ' + (currentIndex + 1) + ' von ' + total;
  document.getElementById('progressBar').style.width = ((currentIndex + 1) / total * 100) + '%';
}

function checkAnswer(selectedIdx) {
  if (answered) return;
  answered = true;

  var q = deck[currentIndex];
  var isCorrect = (selectedIdx === q.correct);

  document.querySelectorAll('.answer-btn').forEach(function(b) {
    b.disabled = true;
    var idx = q.options.indexOf(b.textContent);
    if (idx === q.correct) {
      b.classList.add('correct');
    } else if (idx === selectedIdx && !isCorrect) {
      b.classList.add('wrong');
    }
  });

  if (isCorrect) {
    scoreCorrect++;
    scoreSerie++;
  } else {
    scoreWrong++;
    scoreSerie = 0;
  }
  updateScoreBar();

  var feedback = document.getElementById('feedback');
  var feedbackTitle = document.getElementById('feedbackTitle');

  if (isCorrect) {
    feedback.className = 'feedback correct';
    feedbackTitle.textContent = 'Richtig!';
  } else {
    feedback.className = 'feedback wrong';
    feedbackTitle.textContent = 'Falsch. Richtig wäre: ' + q.options[q.correct];
  }
  document.getElementById('feedbackText').textContent = q.explanation;

  var nav = document.getElementById('quizNav');
  nav.style.display = 'flex';
  document.getElementById('nextBtn').textContent =
    (currentIndex >= deck.length - 1) ? 'Ergebnis anzeigen' : 'Weiter →';
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= deck.length) {
    showEndScreen();
  } else {
    showQuestion();
  }
}

function showEndScreen() {
  document.getElementById('questionCard').style.display = 'none';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('quizNav').style.display = 'none';
  document.getElementById('progressText').style.display = 'none';
  document.getElementById('progressBar').parentElement.style.display = 'none';

  var total = deck.length;
  var pct = Math.round(scoreCorrect / total * 100);

  document.getElementById('endScore').textContent = scoreCorrect + ' von ' + total + ' richtig';

  var msg;
  if (pct >= 90)      msg = 'Ausgezeichnet! Sie kennen die Rahmreifung und das KWK-Verfahren sehr gut.';
  else if (pct >= 70) msg = 'Gut gemacht! Noch ein paar Fragen üben und Sie sind top.';
  else if (pct >= 50) msg = 'Nicht schlecht. Schauen Sie das Lehrmittel nochmals an.';
  else                msg = 'Schauen Sie das Lehrmittel nochmals an. Dann klappt es besser.';

  document.getElementById('endText').textContent = pct + ' % richtig. ' + msg;
  document.getElementById('endScreen').classList.add('visible');
}

setLevel('einfach');
</script>
<footer class="bzwu-footer">
  BZWU Wil-Uzwil · Milchpraktiker EBA · Philipp Neukomm
</footer>

</body>
</html>
