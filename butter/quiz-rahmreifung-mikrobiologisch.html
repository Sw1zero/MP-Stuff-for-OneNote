<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mikrobiologische Rahmreifung - Quiz</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .quiz-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 56px;
      max-width: 560px;
      margin: 0 auto;
    }

    /* Score-Leiste */
    .score-bar {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
      justify-content: center;
    }
    .score-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .score-number {
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1;
    }
    .score-label {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-subtle);
    }
    .score-correct { color: #38a169; }
    .score-wrong   { color: var(--red); }
    .score-serie   { color: var(--blue-dark); }

    /* Fortschritt */
    .progress-text {
      font-size: 0.82rem;
      color: var(--text-subtle);
      margin-bottom: 6px;
      text-align: center;
      width: 100%;
    }
    .progress-bar-wrap {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    /* Fragekarte */
    .question-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 28px;
      width: 100%;
      margin-bottom: 14px;
    }
    .question-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 14px;
      background: #dcfce7;
      color: #15803d;
    }
    .question-text {
      font-size: 1.0rem;
      font-weight: 600;
      line-height: 1.55;
      color: var(--text);
      margin-bottom: 20px;
    }

    /* Antwort-Buttons */
    .answers {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .answer-btn {
      font-family: var(--font);
      font-size: 0.88rem;
      font-weight: 500;
      text-align: left;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      line-height: 1.4;
    }
    .answer-btn:hover:not(:disabled) {
      border-color: var(--blue-light);
      background: var(--blue-tint);
    }
    .answer-btn.correct {
      border-color: #38a169;
      background: #dcfce7;
      color: #15803d;
      font-weight: 600;
    }
    .answer-btn.wrong {
      border-color: var(--red);
      background: var(--red-light);
      color: var(--red-dark);
    }
    .answer-btn:disabled { cursor: default; }

    /* Rückmeldung */
    .feedback {
      width: 100%;
      border-radius: var(--radius-md);
      padding: 14px 18px;
      font-size: 0.88rem;
      line-height: 1.55;
      display: none;
      margin-bottom: 14px;
    }
    .feedback.correct {
      background: #dcfce7;
      border: 1px solid #86efac;
      color: #15803d;
      display: block;
    }
    .feedback.wrong {
      background: var(--red-light);
      border: 1px solid #fca5a5;
      color: #991b1b;
      display: block;
    }
    .feedback-title {
      font-weight: 700;
      margin-bottom: 4px;
    }

    /* Weiter-Button */
    .quiz-nav {
      width: 100%;
      display: flex;
      justify-content: flex-end;
    }

    /* Ergebnis-Bildschirm */
    .end-screen {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 40px 28px;
      width: 100%;
      text-align: center;
      display: none;
    }
    .end-screen.visible { display: block; }
    .end-big {
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--blue-dark);
      margin-bottom: 8px;
    }
    .end-text {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.55;
    }
  </style>
</head>
<body>

<header class="bzwu-header">
  <div class="header-text">
    <span class="school-badge">BZWU Wil-Uzwil · Milchpraktiker EBA · Butter</span>
    <h1>Mikrobiologische Rahmreifung - Quiz</h1>
    <p>Wählen Sie die richtige Antwort. Sie erhalten sofort eine Rückmeldung.</p>
  </div>
  <div class="header-logos">
    <img src="../assets/logos/bzwu.png" alt="BZWU" class="header-logo">
    <img src="../assets/logos/milchtechnologen.svg" alt="Milchtechnologen" class="header-logo">
  </div>
</header>

<main>
<div class="quiz-wrap">
  <a class="back-link" href="../index.html">&#8592; Alle Lerntools</a>

  <div class="score-bar">
    <div class="score-item">
      <span class="score-number score-correct" id="scoreCorrect">0</span>
      <span class="score-label">Richtig</span>
    </div>
    <div class="score-item">
      <span class="score-number score-wrong" id="scoreWrong">0</span>
      <span class="score-label">Falsch</span>
    </div>
    <div class="score-item">
      <span class="score-number score-serie" id="scoreSerie">0</span>
      <span class="score-label">Serie</span>
    </div>
  </div>

  <div class="progress-text" id="progressText"></div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar"></div>
  </div>

  <div class="question-card" id="questionCard">
    <span class="question-badge">Rahmreifung</span>
    <div class="question-text" id="questionText"></div>
    <div class="answers" id="answers"></div>
  </div>

  <div class="feedback" id="feedback">
    <div class="feedback-title" id="feedbackTitle"></div>
    <div id="feedbackText"></div>
  </div>

  <div class="quiz-nav" id="quizNav" style="display:none;">
    <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">Weiter &#8594;</button>
  </div>

  <div class="end-screen" id="endScreen">
    <div class="end-big" id="endScore"></div>
    <div class="end-text" id="endText"></div>
    <button class="btn btn-primary" onclick="restartQuiz()">Nochmals versuchen</button>
  </div>

</div>
</main>

<script>
var ALL_QUESTIONS = [
  { q: 'Was passiert bei der mikrobiologischen Rahmreifung?',
    options: ['Der Rahm wird abgekühlt', 'Der Rahm wird angesäuert', 'Das Milchfett wird kristallisiert', 'Der Rahm wird pasteurisiert'],
    correct: 1,
    explanation: 'Bei der mikrobiologischen Rahmreifung säuern Milchsäurebakterien den Rahm an. Das ist etwas anderes als die physikalische Rahmreifung. Dort kristallisiert das Milchfett.'
  },
  { q: 'Wie heissen die Bakterien, die man für die mikrobiologische Rahmreifung braucht?',
    options: ['Rahmsäurewecker', 'Joghurtkulturen', 'Reifungshefen', 'Schimmelkulturen'],
    correct: 0,
    explanation: 'Rahmsäurewecker sind spezielle Milchsäurebakterien für die Rahmreifung.'
  },
  { q: 'Was machen die Säurebildner (homofermentative Bakterien) hauptsächlich?',
    options: ['Sie bilden vor allem Milchsäure', 'Sie bilden vor allem Kohlendioxid', 'Sie bilden vor allem Aromastoffe', 'Sie bilden vor allem Fett'],
    correct: 0,
    explanation: 'Homofermentative Bakterien wie Lc lactis ssp. lactis oder cremoris bilden hauptsächlich Milchsäure.'
  },
  { q: 'Was bilden die Aromabildner (heterofermentative Bakterien) zusätzlich zur Milchsäure?',
    options: ['Nur Wasser', 'Aromastoffe wie Diacetyl und Kohlendioxid', 'Nur Salz', 'Nur Fett'],
    correct: 1,
    explanation: 'Heterofermentative Bakterien wie Ln mesenteroides ssp. cremoris bilden auch Aromastoffe, zum Beispiel Diacetyl. Das gibt der Butter mehr Geschmack.'
  },
  { q: 'Bei welcher Temperatur arbeiten diese Bakterien am besten (Temperaturoptimum)?',
    options: ['0-10 °C', '20-30 °C', '40-50 °C', '60-70 °C'],
    correct: 1,
    explanation: 'Die Bakterien sind mesophil. Ihr Temperaturoptimum liegt bei 20-30 °C.'
  },
  { q: 'Wie lange dauert die mikrobiologische Rahmreifung mindestens?',
    options: ['1 Stunde', '4 Stunden', '10 Stunden', '24 Stunden'],
    correct: 2,
    explanation: 'Die mikrobiologische Rahmreifung dauert mindestens 10 Stunden, bei 20-24 °C.'
  },
  { q: 'Auf welchen pH-Wert soll der Rahm bei der mikrobiologischen Reifung sinken?',
    options: ['unter 5.0', 'unter 7.0', 'über 6.5', 'über 8.0'],
    correct: 0,
    explanation: 'Der pH-Wert soll unter 5.0 sinken. Das zeigt: es ist genug Milchsäure entstanden.'
  },
  { q: 'Wie stoppt man die Säuerung des Rahms?',
    options: ['Man erwärmt den Rahm', 'Man kühlt den Rahm', 'Man salzt den Rahm', 'Man rührt den Rahm stärker'],
    correct: 1,
    explanation: 'Durch das Kühlen des Rahms wird die Säuerung gestoppt. Die Bakterien werden dann inaktiv.'
  },
  { q: 'Welchen Vorteil hat die mikrobiologische Rahmreifung für den Geschmack der Butter?',
    options: ['Die Butter wird aromatischer und intensiver im Geschmack', 'Die Butter wird geschmacklos', 'Die Butter schmeckt süsser', 'Die Butter schmeckt salziger'],
    correct: 0,
    explanation: 'Durch die Säure und die Aromastoffe wird die Butter aromatischer. Sie hat einen intensiveren Geschmack.'
  },
  { q: 'Welchen Vorteil hat der tiefere pH-Wert für die Haltbarkeit der Butter?',
    options: ['Die Butter wird schneller schlecht', 'Die Butter hält länger', 'Die Haltbarkeit ändert sich nicht', 'Die Butter muss sofort verkauft werden'],
    correct: 1,
    explanation: 'Wegen dem tieferen pH-Wert hält die Butter länger. Die saure Umgebung hemmt unerwünschte Bakterien.'
  }
];

var deck = [];
var currentIndex = 0;
var answered = false;
var scoreCorrect = 0;
var scoreWrong = 0;
var scoreSerie = 0;

function buildDeck() {
  deck = ALL_QUESTIONS.slice();
  for (var i = deck.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = deck[i]; deck[i] = deck[j]; deck[j] = tmp;
  }
}

function resetQuiz() {
  scoreCorrect = 0;
  scoreWrong = 0;
  scoreSerie = 0;
  updateScoreBar();
  buildDeck();
  currentIndex = 0;
  document.getElementById('endScreen').classList.remove('visible');
  document.getElementById('questionCard').style.display = '';
  document.getElementById('progressText').style.display = '';
  document.getElementById('progressBar').parentElement.style.display = '';
  showQuestion();
}

function restartQuiz() {
  resetQuiz();
}

function updateScoreBar() {
  document.getElementById('scoreCorrect').textContent = scoreCorrect;
  document.getElementById('scoreWrong').textContent = scoreWrong;
  document.getElementById('scoreSerie').textContent = scoreSerie;
}

function showQuestion() {
  answered = false;
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('quizNav').style.display = 'none';

  var q = deck[currentIndex];
  document.getElementById('questionText').textContent = q.q;

  var answersDiv = document.getElementById('answers');
  answersDiv.innerHTML = '';

  var indices = [0, 1, 2, 3];
  for (var i = indices.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = indices[i]; indices[i] = indices[j]; indices[j] = tmp;
  }

  for (var k = 0; k < indices.length; k++) {
    (function(optIdx) {
      var btn = document.createElement('button');
      btn.className = 'answer-btn';
      btn.textContent = q.options[optIdx];
      btn.onclick = function() { checkAnswer(optIdx); };
      answersDiv.appendChild(btn);
    })(indices[k]);
  }

  var total = deck.length;
  document.getElementById('progressText').textContent = 'Frage ' + (currentIndex + 1) + ' von ' + total;
  document.getElementById('progressBar').style.width = ((currentIndex + 1) / total * 100) + '%';
}

function checkAnswer(selectedIdx) {
  if (answered) return;
  answered = true;

  var q = deck[currentIndex];
  var isCorrect = (selectedIdx === q.correct);

  document.querySelectorAll('.answer-btn').forEach(function(b) {
    b.disabled = true;
    var idx = q.options.indexOf(b.textContent);
    if (idx === q.correct) {
      b.classList.add('correct');
    } else if (idx === selectedIdx && !isCorrect) {
      b.classList.add('wrong');
    }
  });

  if (isCorrect) {
    scoreCorrect++;
    scoreSerie++;
  } else {
    scoreWrong++;
    scoreSerie = 0;
  }
  updateScoreBar();

  var feedback = document.getElementById('feedback');
  var feedbackTitle = document.getElementById('feedbackTitle');

  if (isCorrect) {
    feedback.className = 'feedback correct';
    feedbackTitle.textContent = 'Richtig!';
  } else {
    feedback.className = 'feedback wrong';
    feedbackTitle.textContent = 'Falsch. Richtig wäre: ' + q.options[q.correct];
  }
  document.getElementById('feedbackText').textContent = q.explanation;

  var nav = document.getElementById('quizNav');
  nav.style.display = 'flex';
  document.getElementById('nextBtn').textContent =
    (currentIndex >= deck.length - 1) ? 'Ergebnis anzeigen' : 'Weiter →';
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= deck.length) {
    showEndScreen();
  } else {
    showQuestion();
  }
}

function showEndScreen() {
  document.getElementById('questionCard').style.display = 'none';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('quizNav').style.display = 'none';
  document.getElementById('progressText').style.display = 'none';
  document.getElementById('progressBar').parentElement.style.display = 'none';

  var total = deck.length;
  var pct = Math.round(scoreCorrect / total * 100);

  document.getElementById('endScore').textContent = scoreCorrect + ' von ' + total + ' richtig';

  var msg;
  if (pct >= 90)      msg = 'Ausgezeichnet! Sie kennen die mikrobiologische Rahmreifung sehr gut.';
  else if (pct >= 70) msg = 'Gut gemacht! Noch ein paar Fragen üben und Sie sind top.';
  else if (pct >= 50) msg = 'Nicht schlecht. Schauen Sie das Lehrmittel nochmals an.';
  else                msg = 'Schauen Sie das Lehrmittel nochmals an. Dann klappt es besser.';

  document.getElementById('endText').textContent = pct + ' % richtig. ' + msg;
  document.getElementById('endScreen').classList.add('visible');
}

buildDeck();
showQuestion();
</script>
<footer class="bzwu-footer">
  BZWU Wil-Uzwil · Milchpraktiker EBA · Philipp Neukomm
</footer>

</body>
</html>
