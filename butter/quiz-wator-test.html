<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wator-Test - Quiz</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .quiz-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 56px;
      max-width: 560px;
      margin: 0 auto;
    }

    /* Score-Leiste */
    .score-bar {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
      justify-content: center;
    }
    .score-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .score-number {
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1;
    }
    .score-label {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-subtle);
    }
    .score-correct { color: #38a169; }
    .score-wrong   { color: var(--red); }
    .score-serie   { color: var(--blue-dark); }

    /* Fortschritt */
    .progress-text {
      font-size: 0.82rem;
      color: var(--text-subtle);
      margin-bottom: 6px;
      text-align: center;
      width: 100%;
    }
    .progress-bar-wrap {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    /* Fragekarte */
    .question-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 28px;
      width: 100%;
      margin-bottom: 14px;
    }
    .question-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 14px;
      background: #dcfce7;
      color: #15803d;
    }
    .question-text {
      font-size: 1.0rem;
      font-weight: 600;
      line-height: 1.55;
      color: var(--text);
      margin-bottom: 20px;
    }

    /* Antwort-Buttons */
    .answers {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .answer-btn {
      font-family: var(--font);
      font-size: 0.88rem;
      font-weight: 500;
      text-align: left;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      line-height: 1.4;
    }
    .answer-btn:hover:not(:disabled) {
      border-color: var(--blue-light);
      background: var(--blue-tint);
    }
    .answer-btn.correct {
      border-color: #38a169;
      background: #dcfce7;
      color: #15803d;
      font-weight: 600;
    }
    .answer-btn.wrong {
      border-color: var(--red);
      background: var(--red-light);
      color: var(--red-dark);
    }
    .answer-btn:disabled { cursor: default; }

    /* Rückmeldung */
    .feedback {
      width: 100%;
      border-radius: var(--radius-md);
      padding: 14px 18px;
      font-size: 0.88rem;
      line-height: 1.55;
      display: none;
      margin-bottom: 14px;
    }
    .feedback.correct {
      background: #dcfce7;
      border: 1px solid #86efac;
      color: #15803d;
      display: block;
    }
    .feedback.wrong {
      background: var(--red-light);
      border: 1px solid #fca5a5;
      color: #991b1b;
      display: block;
    }
    .feedback-title {
      font-weight: 700;
      margin-bottom: 4px;
    }

    /* Weiter-Button */
    .quiz-nav {
      width: 100%;
      display: flex;
      justify-content: flex-end;
    }

    /* Ergebnis-Bildschirm */
    .end-screen {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 40px 28px;
      width: 100%;
      text-align: center;
      display: none;
    }
    .end-screen.visible { display: block; }
    .end-big {
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--blue-dark);
      margin-bottom: 8px;
    }
    .end-text {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.55;
    }
  </style>
</head>
<body>

<header class="bzwu-header">
  <div class="header-text">
    <span class="school-badge">BZWU Wil-Uzwil · Milchpraktiker EBA · Butter</span>
    <h1>Wator-Test - Quiz</h1>
    <p>Wählen Sie die richtige Antwort. Sie erhalten sofort eine Rückmeldung.</p>
  </div>
  <div class="header-logos">
    <img src="../assets/logos/bzwu.png" alt="BZWU" class="header-logo">
    <img src="../assets/logos/milchtechnologen.svg" alt="Milchtechnologen" class="header-logo">
  </div>
</header>

<main>
<div class="quiz-wrap">
  <a class="back-link" href="../index.html">&#8592; Alle Lerntools</a>

  <div class="score-bar">
    <div class="score-item">
      <span class="score-number score-correct" id="scoreCorrect">0</span>
      <span class="score-label">Richtig</span>
    </div>
    <div class="score-item">
      <span class="score-number score-wrong" id="scoreWrong">0</span>
      <span class="score-label">Falsch</span>
    </div>
    <div class="score-item">
      <span class="score-number score-serie" id="scoreSerie">0</span>
      <span class="score-label">Serie</span>
    </div>
  </div>

  <div class="progress-text" id="progressText"></div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar"></div>
  </div>

  <div class="question-card" id="questionCard">
    <span class="question-badge">Wator-Test</span>
    <div class="question-text" id="questionText"></div>
    <div class="answers" id="answers"></div>
  </div>

  <div class="feedback" id="feedback">
    <div class="feedback-title" id="feedbackTitle"></div>
    <div id="feedbackText"></div>
  </div>

  <div class="quiz-nav" id="quizNav" style="display:none;">
    <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">Weiter &#8594;</button>
  </div>

  <div class="end-screen" id="endScreen">
    <div class="end-big" id="endScore"></div>
    <div class="end-text" id="endText"></div>
    <button class="btn btn-primary" onclick="restartQuiz()">Nochmals versuchen</button>
  </div>

</div>
</main>

<script src="../assets/quiz-engine.js"></script>
<script>
var ALL_QUESTIONS = [
  { q: 'Was zeigt der Wator-Test?',
    options: ['Die Wasserverteilung in der Butter', 'Den Fettgehalt der Butter', 'Den Salzgehalt der Butter', 'Die Butterkorngrösse'],
    correct: 0,
    explanation: 'Der Wator-Test zeigt, wie gut das Wasser in der Butter verteilt ist. Das prüft man am Ende des Trockenknetens.'
  },
  { q: 'Wie reagiert das Wator-Indikatorpapier auf Wasser?',
    options: ['Es wird tiefblau', 'Es wird rot', 'Es wird durchsichtig', 'Es riecht sauer'],
    correct: 0,
    explanation: 'Das Indikatorpapier wird tiefblau, wenn es mit Wasser in Kontakt kommt.'
  },
  { q: 'Wann macht man den Wator-Test?',
    options: ['Vor dem Buttern', 'Am Ende des Nach- oder Trockenknetens', 'Beim Rahmreifen', 'Beim Verpacken'],
    correct: 1,
    explanation: 'Der Wator-Test kontrolliert die Wasserverteilung am Ende des Nach- oder Trockenknetens.'
  },
  { q: 'Was ist der erste Schritt beim Wator-Test?',
    options: ['Die Butter kühlen', 'Eine glatte Schnittfläche in die Butter machen', 'Die Butter wägen', 'Die Butter erwärmen'],
    correct: 1,
    explanation: 'Mit einem Butterschneidedraht oder einer Kelle macht man zuerst eine glatte Schnittfläche in der Butter.'
  },
  { q: 'Was macht man mit dem Indikatorpapier?',
    options: ['Es wird sofort auf die Schnittfläche gelegt und leicht angedrückt', 'Es wird in Wasser getaucht', 'Es wird in den Ofen gelegt', 'Es wird auf die Verpackung geklebt'],
    correct: 0,
    explanation: 'Das Indikatorpapier wird sofort auf die frische Schnittfläche gelegt und leicht angedrückt.'
  },
  { q: 'Wie wird das Ergebnis des Wator-Tests beurteilt?',
    options: ['Mit einer Note von 1 bis 5 anhand von Vergleichsbildern', 'Mit einer Prozentzahl', 'Mit einer Farbe: grün oder rot', 'Mit einem Gewicht in Gramm'],
    correct: 0,
    explanation: 'Man vergleicht die Verfärbung mit Vergleichsbildern und gibt eine Note von 1 bis 5.'
  },
  { q: 'Welche Wator-Note sollte Butter nach korrektem Trockenkneten haben?',
    options: ['Note 1 bis 2', 'Note 3', 'Note 4 bis 5', 'Die Note spielt keine Rolle'],
    correct: 0,
    explanation: 'Nach korrektem Trockenkneten sollte die Butter die Note 1 bis 2 erhalten.'
  },
  { q: 'Ihre Butter erhält beim Wator-Test die Note 4. Was sollten Sie tun?',
    options: ['Nichts, die Butter ist in Ordnung', 'Das Trockenkneten verlängern oder verbessern', 'Mehr Wasser zugeben', 'Die Butter sofort verpacken'],
    correct: 1,
    explanation: 'Ab Note 3 ist die Wasserverteilung ungenügend. Das Trockenkneten sollte verlängert oder verbessert werden.'
  },
  { q: 'Warum ist eine gute Wasserverteilung wichtig für die Haltbarkeit der Butter?',
    options: ['In grossen Wasseransammlungen können sich Mikroorganismen rascher vermehren', 'Wasser macht die Butter schwerer', 'Wasser verändert die Farbe der Butter', 'Wasser hat keinen Einfluss auf die Haltbarkeit'],
    correct: 0,
    explanation: 'In grossen Wasseransammlungen vermehren sich Mikroorganismen schneller. Das lässt die Butter schneller verderben.'
  },
  { q: 'Butter mit schlechter Wasserverteilung nennt man...',
    options: ['wasserlässig', 'schmierig', 'ranzig', 'talgig'],
    correct: 0,
    explanation: 'Man nennt sie wasserlässig. Das wird oft mit einer Warenfälschung in Verbindung gebracht.'
  }
];

QuizEngine.init({
  questions: ALL_QUESTIONS,
  messages: {
    excellent: 'Ausgezeichnet! Sie kennen den Wator-Test sehr gut.',
    good: 'Gut gemacht! Noch ein paar Fragen üben und Sie sind top.',
    ok: 'Nicht schlecht. Schauen Sie das Arbeitsblatt nochmals an.',
    poor: 'Schauen Sie das Arbeitsblatt nochmals an. Dann klappt es besser.'
  }
});
</script>
<footer class="bzwu-footer">
  BZWU Wil-Uzwil · Milchpraktiker EBA · Philipp Neukomm
</footer>

</body>
</html>
