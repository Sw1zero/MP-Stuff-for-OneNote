<script>
Lernkaertchen.init({
  karten: [
    { vorne: 'Aus welcher Milch wird Mozzarella hergestellt?', hinten: 'Meist aus <strong>Kuhmilch</strong>. Der Original-Mozzarella aus Italien wird aus Büffelmilch gemacht. Für Vollfettkäse braucht die Milch ca. <strong>3 % Fett</strong>.', kategorie: 'Rohstoff & Kulturen' },
    { vorne: 'Warum wird die Mozzarella-Milch homogenisiert?', hinten: 'Die Milch wird mit <strong>30–50 bar</strong> gleichmässig verteilt. Das macht den Teig weicher. Es bindet mehr Wasser und erhöht die Ausbeute. Zu hoher Druck schadet, er lässt Fett in die Molke entweichen.', kategorie: 'Rohstoff & Kulturen' },
    { vorne: 'Bei welcher Temperatur wird Mozzarella-Milch pasteurisiert?', hinten: 'Mindestens <strong>15 Sekunden</strong> bei ca. <strong>75 °C</strong>.', kategorie: 'Rohstoff & Kulturen' },
    { vorne: 'Welche Kulturen braucht man für Mozzarella?', hinten: '<strong>Thermophile oder mesophile</strong> Mischkulturen. Sie müssen schnell säuern. Sonst dauert der Herstellungsprozess zu lang.', kategorie: 'Rohstoff & Kulturen' },
    { vorne: 'Was ist der Unterschied: fermentierter vs. unfermentierter Mozzarella?', hinten: '<strong>Fermentiert:</strong> Milchsäurebakterien senken den pH-Wert im Käse.<br><strong>Unfermentiert:</strong> Man gibt Zitronen- oder Milchsäure direkt in die Milch.', kategorie: 'Rohstoff & Kulturen' },
    { vorne: 'Auf welchen pH-Wert wird die Milch bei unfermentiertem Mozzarella gesenkt?', hinten: 'Auf <strong>pH 5,7–5,8</strong>. Das geschieht durch Zugabe von Zitronen- oder Milchsäure vor dem Einlaben.', kategorie: 'Rohstoff & Kulturen' },
    { vorne: 'Was bedeutet «Pasta filata»?', hinten: '«Pasta filata» ist Italienisch und heisst <strong>gezogener Teig</strong>. Der Käsebruch wird in heissem Wasser geknetet, gezogen und gedehnt. Dadurch wird Mozzarella faserig und elastisch.', kategorie: 'Herstellung' },
    { vorne: 'Wie gross wird der Mozzarella-Bruch geschnitten?', hinten: 'Ca. so gross wie eine <strong>Haselnuss</strong>. Das ist grober als bei anderen Käsen. So bleibt mehr Fett im Bruch.', kategorie: 'Herstellung' },
    { vorne: 'Auf welche Temperatur wird der Bruch beim Nachwärmen erhitzt?', hinten: 'Auf <strong>36–40 °C</strong>. Das fördert die Synärese, also den Austritt von Molke aus dem Bruch.', kategorie: 'Herstellung' },
    { vorne: 'Was ist Synärese?', hinten: 'Synärese bedeutet: <strong>Molke tritt aus dem Bruch oder Käse aus</strong>. Bei der Herstellung ist das gewünscht. Bei der Lagerung ist es ein Fehler.', kategorie: 'Herstellung' },
    { vorne: 'Wie läuft das Pastafilieren ab?', hinten: 'Der Bruch kommt in <strong>70–75 °C</strong> heisses Wasser. Er erwärmt sich auf <strong>57–59 °C</strong>. Dann wird er geknetet, gezogen und gedehnt, bis er faserig und glatt ist.', kategorie: 'Herstellung' },
    { vorne: 'Welchen pH-Wert braucht der Bruch beim Pastafilieren?', hinten: '<strong>Fermentiert:</strong> ca. pH 5,2<br><strong>Unfermentiert:</strong> ca. pH 5,7<br>Bei falschem pH reisst die Masse oder wird klumpig, das Pastafilieren funktioniert nicht.', kategorie: 'Herstellung' },
    { vorne: 'Wie wird Mozzarella nach dem Pastafilieren geformt?', hinten: 'Als <strong>Kugeln oder Stangen</strong>. In kleinen Betrieben von Hand. In Grossbetrieben mit Ausformmaschinen.', kategorie: 'Herstellung' },
    { vorne: 'Was ist der Unterschied im Teig: fermentiert vs. unfermentiert?', hinten: '<strong>Fermentiert:</strong> fester, gut zum Raffeln, intensiver Geschmack, ideal für Pizza und Lasagne.<br><strong>Unfermentiert:</strong> weicher, saftiger, mildes Milcharoma,ideal für Salate und Sandwiches.', kategorie: 'Herstellung' },
    { vorne: 'Was verursacht einen festen, zähen Teig bei Mozzarella?', hinten: 'Die <strong>Pastafilata-Temperatur war zu tief</strong>. Die Masse konnte nicht richtig gedehnt werden.', kategorie: 'Qualitätsmängel' },
    { vorne: 'Was verursacht einen kurzen, trockenen Teig?', hinten: 'Die <strong>Pastafilata-Temperatur war zu hoch</strong>. Oder der Teig wurde zu lange geknetet. Fett tritt ins Wasser aus.', kategorie: 'Qualitätsmängel' },
    { vorne: 'Was verursacht einen pappigen Teig bei der Lagerung?', hinten: '<strong>Zu hoher Wasser- oder Salzgehalt.</strong> Oder die Milchsäurebakterien bauen das Eiweiss während der Lagerung ab.', kategorie: 'Qualitätsmängel' },
    { vorne: 'Was verursacht schlechte Schmelzeigenschaften (klumpig, fettig)?', hinten: '<strong>Zu hoher pH-Wert</strong> im Käse → viel Kalzium → Fett tritt beim Schmelzen aus. Auch <strong>zu wenig Salz</strong> ist eine häufige Ursache.', kategorie: 'Qualitätsmängel' },
    { vorne: 'Was verursacht Schimmelwachstum auf Mozzarella?', hinten: '<strong>Unterbrochene Kühlkette.</strong> Infektionen beim Kühlen oder Verpacken. Oder eine undichte Verpackung.', kategorie: 'Qualitätsmängel' },
    { vorne: 'Was verursacht Kochgeschmack bei Mozzarella?', hinten: 'Eine <strong>zu hohe Pasteurisationstemperatur</strong>. Das Eiweiss verändert sich und gibt einen gekochten Beigeschmack.', kategorie: 'Qualitätsmängel' }
  ]
});
</script>
