<script src="../assets/sortierer.js?v=40e5baa8"></script>
<script>
Sortierer.init({
  steps: [
    { text: 'Milch homogenisieren (30-50 bar). Fett verteilt sich gleichmässig in der Milch.' },
    { text: 'Pasteurisieren: mindestens 15 Sekunden bei 75 °C. Keime werden abgetötet.' },
    { text: 'Milch abkühlen. Kulturen zugeben (fermentiert) oder Säure zugeben (unfermentiert).' },
    { text: 'Lab zugeben. Die Milch gerinnt zum festen Gallert.' },
    { text: 'Käsebruch schneiden: ca. so gross wie eine Haselnuss.' },
    { text: 'Bruch nachwärmen auf 36-40 °C. Molke tritt aus dem Bruch (Synärese).' },
    { text: 'Molke ablassen. Bruch in heisses Pastafilier-Wasser geben (70-75 °C).' },
    { text: 'Pastafilieren: Bruch kneten, ziehen und dehnen bis die Masse 57-59 °C hat.' },
    { text: 'Kugeln oder Stangen formen. Im Salzbad kühlen.' }
  ]
});
</script>
