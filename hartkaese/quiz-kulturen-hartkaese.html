<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kulturen beim Hartkäse - Quiz</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .quiz-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 56px;
      max-width: 560px;
      margin: 0 auto;
    }

    /* Score-Leiste */
    .score-bar {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
      justify-content: center;
    }
    .score-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .score-number {
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1;
    }
    .score-label {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-subtle);
    }
    .score-correct { color: #38a169; }
    .score-wrong   { color: var(--red); }
    .score-serie   { color: var(--blue-dark); }

    /* Fortschritt */
    .progress-text {
      font-size: 0.82rem;
      color: var(--text-subtle);
      margin-bottom: 6px;
      text-align: center;
      width: 100%;
    }
    .progress-bar-wrap {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    /* Fragekarte */
    .question-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 28px;
      width: 100%;
      margin-bottom: 14px;
    }
    .question-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 14px;
      background: #dcfce7;
      color: #15803d;
    }
    .question-text {
      font-size: 1.0rem;
      font-weight: 600;
      line-height: 1.55;
      color: var(--text);
      margin-bottom: 20px;
    }

    /* Antwort-Buttons */
    .answers {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .answer-btn {
      font-family: var(--font);
      font-size: 0.88rem;
      font-weight: 500;
      text-align: left;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      line-height: 1.4;
    }
    .answer-btn:hover:not(:disabled) {
      border-color: var(--blue-light);
      background: var(--blue-tint);
    }
    .answer-btn.correct {
      border-color: #38a169;
      background: #dcfce7;
      color: #15803d;
      font-weight: 600;
    }
    .answer-btn.wrong {
      border-color: var(--red);
      background: var(--red-light);
      color: var(--red-dark);
    }
    .answer-btn:disabled { cursor: default; }

    /* Rückmeldung */
    .feedback {
      width: 100%;
      border-radius: var(--radius-md);
      padding: 14px 18px;
      font-size: 0.88rem;
      line-height: 1.55;
      display: none;
      margin-bottom: 14px;
    }
    .feedback.correct {
      background: #dcfce7;
      border: 1px solid #86efac;
      color: #15803d;
      display: block;
    }
    .feedback.wrong {
      background: var(--red-light);
      border: 1px solid #fca5a5;
      color: #991b1b;
      display: block;
    }
    .feedback-title {
      font-weight: 700;
      margin-bottom: 4px;
    }

    /* Weiter-Button */
    .quiz-nav {
      width: 100%;
      display: flex;
      justify-content: flex-end;
    }

    /* Ergebnis-Bildschirm */
    .end-screen {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 40px 28px;
      width: 100%;
      text-align: center;
      display: none;
    }
    .end-screen.visible { display: block; }
    .end-big {
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--blue-dark);
      margin-bottom: 8px;
    }
    .end-text {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.55;
    }
  </style>
</head>
<body>

<header class="bzwu-header">
  <div class="header-text">
    <span class="school-badge">BZWU Wil-Uzwil · Milchpraktiker EBA · Hartkäse</span>
    <h1>Kulturen beim Hartkäse - Quiz</h1>
    <p>Wählen Sie die richtige Antwort. Sie erhalten sofort eine Rückmeldung.</p>
  </div>
  <div class="header-logos">
    <img src="../assets/logos/bzwu.png" alt="BZWU" class="header-logo">
    <img src="../assets/logos/milchtechnologen.svg" alt="Milchtechnologen" class="header-logo">
  </div>
</header>

<main>
<div class="quiz-wrap">
  <a class="back-link" href="../index.html">&#8592; Alle Lerntools</a>

  <div class="score-bar">
    <div class="score-item">
      <span class="score-number score-correct" id="scoreCorrect">0</span>
      <span class="score-label">Richtig</span>
    </div>
    <div class="score-item">
      <span class="score-number score-wrong" id="scoreWrong">0</span>
      <span class="score-label">Falsch</span>
    </div>
    <div class="score-item">
      <span class="score-number score-serie" id="scoreSerie">0</span>
      <span class="score-label">Serie</span>
    </div>
  </div>

  <div class="progress-text" id="progressText"></div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar"></div>
  </div>

  <div class="question-card" id="questionCard">
    <span class="question-badge">Kulturen</span>
    <div class="question-text" id="questionText"></div>
    <div class="answers" id="answers"></div>
  </div>

  <div class="feedback" id="feedback">
    <div class="feedback-title" id="feedbackTitle"></div>
    <div id="feedbackText"></div>
  </div>

  <div class="quiz-nav" id="quizNav" style="display:none;">
    <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">Weiter &#8594;</button>
  </div>

  <div class="end-screen" id="endScreen">
    <div class="end-big" id="endScore"></div>
    <div class="end-text" id="endText"></div>
    <button class="btn btn-primary" onclick="restartQuiz()">Nochmals versuchen</button>
  </div>

</div>
</main>

<script src="../assets/quiz-engine.js"></script>
<script>
var ALL_QUESTIONS = [
  { q: 'Wahr oder falsch? Milch für Rohmilchkäse dürfen Sie höchstens 36 Stunden lagern.',
    options: ['Wahr', 'Falsch'],
    correct: 0,
    explanation: 'Wahr. Milch für Rohmilchkäse dürfen Sie höchstens 36 Stunden lagern.'
  },
  { q: 'Wahr oder falsch? Eine hohe Lagertemperatur verlangsamt die Keimvermehrung.',
    options: ['Wahr', 'Falsch'],
    correct: 1,
    explanation: 'Falsch. Eine niedrige Lagertemperatur verlangsamt die Keimvermehrung.'
  },
  { q: 'Wozu geben Sie Kulturen in die Milch?',
    options: ['Sie ersetzen das Lab.', 'Sie sichern eine vollständige Milchsäuregärung.', 'Sie machen den Käse gelb.', 'Sie verhindern die Reifung.'],
    correct: 1,
    explanation: 'Die Kulturen sichern eine vollständige Milchsäuregärung.'
  },
  { q: 'Was lenken die Kulturen?',
    options: ['Den Gärungsverlauf', 'Die Salzaufnahme', 'Den Pressdruck', 'Die Kellertemperatur'],
    correct: 0,
    explanation: 'Die Kulturen lenken den Gärungsverlauf im Käse.'
  },
  { q: 'Welche Kultur ist typisch für Hartkäse?',
    options: ['Hefen', 'Schimmelpilze', 'Sc thermophilus', 'Coli-Bakterien'],
    correct: 2,
    explanation: 'Sc thermophilus ist typisch für Hartkäse.'
  },
  { q: 'Bei welcher Temperatur wächst Lc lactis ssp lactis am besten?',
    options: ['25 bis 30 °C', '30 °C', '40 bis 45 °C'],
    correct: 0,
    explanation: 'Lc lactis ssp lactis wächst am besten bei 25 bis 30 °C.'
  },
  { q: 'Bei welcher Temperatur wächst Lb delbrueckii ssp lactis am besten?',
    options: ['25 bis 30 °C', '30 °C', '40 bis 45 °C'],
    correct: 2,
    explanation: 'Lb delbrueckii ssp lactis mag es warm: 40 bis 45 °C.'
  },
  { q: 'Bei welcher Temperatur wächst P. freudenreichii (Propionsäurebakterium) am besten?',
    options: ['25 bis 30 °C', '30 °C', '40 bis 45 °C'],
    correct: 1,
    explanation: 'P. freudenreichii wächst am besten bei 30 °C.'
  },
  { q: 'Was entsteht bei der Propionsäuregärung aus der Milchsäure?',
    options: ['Alkohol und Wasser', 'Milchzucker und Fett', 'Propionsäure, Essigsäure und CO₂', 'Salz und Kasein'],
    correct: 2,
    explanation: 'Die Propionsäurebakterien bauen Milchsäure ab. Dabei entstehen Propionsäure, Essigsäure und CO₂ (Gas).'
  },
  { q: 'Wo beginnt die Propionsäuregärung beim Emmentaler AOP?',
    options: ['Im Salzbad', 'Im Wärmeraum bei 17 bis 24 °C', 'Im Reiferaum bei 10 bis 13 °C'],
    correct: 1,
    explanation: 'Die Propionsäuregärung beginnt im Wärmeraum bei 17 bis 24 °C.'
  },
  { q: 'Was macht das CO₂ (Gas) im Emmentaler?',
    options: ['Die Löcher', 'Die Rinde', 'Den Salzgeschmack', 'Die gelbe Farbe'],
    correct: 0,
    explanation: 'Das Gas CO₂ macht die Löcher im Emmentaler.'
  },
  { q: 'Was gibt die Propionsäure dem Emmentaler?',
    options: ['Die Härte', 'Das typische Aroma', 'Den Salzgehalt', 'Die Form'],
    correct: 1,
    explanation: 'Die Propionsäure gibt dem Emmentaler das typische Aroma.'
  }
];

QuizEngine.init({
  questions: ALL_QUESTIONS,
  messages: {
    excellent: 'Ausgezeichnet! Sie kennen die Kulturen beim Hartkäse sehr gut.',
    good: 'Gut gemacht! Noch ein paar Fragen üben und Sie sind top.',
    ok: 'Nicht schlecht. Schauen Sie das Arbeitsblatt nochmals an.',
    poor: 'Schauen Sie das Arbeitsblatt nochmals an. Dann klappt es besser.'
  }
});
</script>
<footer class="bzwu-footer">
  BZWU Wil-Uzwil · Milchpraktiker EBA · Philipp Neukomm
</footer>

</body>
</html>
