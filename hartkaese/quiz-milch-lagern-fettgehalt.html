<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milch lagern und Fettgehalt - Quiz</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .quiz-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 56px;
      max-width: 560px;
      margin: 0 auto;
    }

    /* Score-Leiste */
    .score-bar {
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
      justify-content: center;
    }
    .score-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .score-number {
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1;
    }
    .score-label {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-subtle);
    }
    .score-correct { color: #38a169; }
    .score-wrong   { color: var(--red); }
    .score-serie   { color: var(--blue-dark); }

    /* Fortschritt */
    .progress-text {
      font-size: 0.82rem;
      color: var(--text-subtle);
      margin-bottom: 6px;
      text-align: center;
      width: 100%;
    }
    .progress-bar-wrap {
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    /* Fragekarte */
    .question-card {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 28px;
      width: 100%;
      margin-bottom: 14px;
    }
    .question-badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 14px;
      background: #dcfce7;
      color: #15803d;
    }
    .question-text {
      font-size: 1.0rem;
      font-weight: 600;
      line-height: 1.55;
      color: var(--text);
      margin-bottom: 20px;
    }

    /* Antwort-Buttons */
    .answers {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .answer-btn {
      font-family: var(--font);
      font-size: 0.88rem;
      font-weight: 500;
      text-align: left;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      line-height: 1.4;
    }
    .answer-btn:hover:not(:disabled) {
      border-color: var(--blue-light);
      background: var(--blue-tint);
    }
    .answer-btn.correct {
      border-color: #38a169;
      background: #dcfce7;
      color: #15803d;
      font-weight: 600;
    }
    .answer-btn.wrong {
      border-color: var(--red);
      background: var(--red-light);
      color: var(--red-dark);
    }
    .answer-btn:disabled { cursor: default; }

    /* Rückmeldung */
    .feedback {
      width: 100%;
      border-radius: var(--radius-md);
      padding: 14px 18px;
      font-size: 0.88rem;
      line-height: 1.55;
      display: none;
      margin-bottom: 14px;
    }
    .feedback.correct {
      background: #dcfce7;
      border: 1px solid #86efac;
      color: #15803d;
      display: block;
    }
    .feedback.wrong {
      background: var(--red-light);
      border: 1px solid #fca5a5;
      color: #991b1b;
      display: block;
    }
    .feedback-title {
      font-weight: 700;
      margin-bottom: 4px;
    }

    /* Weiter-Button */
    .quiz-nav {
      width: 100%;
      display: flex;
      justify-content: flex-end;
    }

    /* Ergebnis-Bildschirm */
    .end-screen {
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      padding: 40px 28px;
      width: 100%;
      text-align: center;
      display: none;
    }
    .end-screen.visible { display: block; }
    .end-big {
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--blue-dark);
      margin-bottom: 8px;
    }
    .end-text {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.55;
    }
  </style>
</head>
<body>

<header class="bzwu-header">
  <div class="header-text">
    <span class="school-badge">BZWU Wil-Uzwil · Milchpraktiker EBA · Hartkäse</span>
    <h1>Milch lagern und Fettgehalt - Quiz</h1>
    <p>Wählen Sie die richtige Antwort. Sie erhalten sofort eine Rückmeldung.</p>
  </div>
  <div class="header-logos">
    <img src="../assets/logos/bzwu.png" alt="BZWU" class="header-logo">
    <img src="../assets/logos/milchtechnologen.svg" alt="Milchtechnologen" class="header-logo">
  </div>
</header>

<main>
<div class="quiz-wrap">
  <a class="back-link" href="../index.html">&#8592; Alle Lerntools</a>

  <div class="score-bar">
    <div class="score-item">
      <span class="score-number score-correct" id="scoreCorrect">0</span>
      <span class="score-label">Richtig</span>
    </div>
    <div class="score-item">
      <span class="score-number score-wrong" id="scoreWrong">0</span>
      <span class="score-label">Falsch</span>
    </div>
    <div class="score-item">
      <span class="score-number score-serie" id="scoreSerie">0</span>
      <span class="score-label">Serie</span>
    </div>
  </div>

  <div class="progress-text" id="progressText"></div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressBar"></div>
  </div>

  <div class="question-card" id="questionCard">
    <span class="question-badge">Milch lagern</span>
    <div class="question-text" id="questionText"></div>
    <div class="answers" id="answers"></div>
  </div>

  <div class="feedback" id="feedback">
    <div class="feedback-title" id="feedbackTitle"></div>
    <div id="feedbackText"></div>
  </div>

  <div class="quiz-nav" id="quizNav" style="display:none;">
    <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">Weiter &#8594;</button>
  </div>

  <div class="end-screen" id="endScreen">
    <div class="end-big" id="endScore"></div>
    <div class="end-text" id="endText"></div>
    <button class="btn btn-primary" onclick="restartQuiz()">Nochmals versuchen</button>
  </div>

</div>
</main>

<script src="../assets/quiz-engine.js"></script>
<script>
var ALL_QUESTIONS = [
  { q: 'Für Hartkäse verwenden Sie Rohmilch. Wie warm darf die Milch vor dem Gerinnen höchstens werden?',
    options: ['40 °C', '50 °C', '63 °C', '72 °C'],
    correct: 0,
    explanation: 'Hartkäse macht man aus Rohmilch. Die Milch darf vor dem Gerinnen nicht über 40 °C erwärmt werden.'
  },
  { q: 'Die Milch der Lieferanten wird 24-mal pro Jahr untersucht. Worauf?',
    options: ['Auf Fettgehalt und Farbe', 'Auf Keimbelastung und Zellgehalt', 'Auf Temperatur und Menge', 'Auf Geruch und Geschmack'],
    correct: 1,
    explanation: 'Man untersucht die Keimbelastung und den Zellgehalt. Auch Hemmstoffe werden geprüft.'
  },
  { q: 'Sie kühlen die Milch nach dem Melken schnell ab. Was bewirkt das?',
    options: ['Der Fettgehalt steigt.', 'Die Milch gerinnt schneller.', 'Die Bakterien wachsen weniger.', 'Es hat keine Wirkung.'],
    correct: 2,
    explanation: 'Schnelles Kühlen verringert das Bakterienwachstum.'
  },
  { q: 'Bei welcher Temperatur lagern Sie Käsereimilch ideal?',
    options: ['4 bis 6 °C', '8 bis 12 °C', '15 bis 18 °C', '20 bis 25 °C'],
    correct: 1,
    explanation: 'Ideal sind 8 bis 12 °C. Eine niedrige Lagertemperatur verlangsamt die Keimvermehrung.'
  },
  { q: 'Wie lange dürfen Sie Milch für Rohmilchkäse höchstens lagern?',
    options: ['24 Stunden', '36 Stunden', '48 Stunden', 'bis 3 Tage'],
    correct: 1,
    explanation: 'Milch für Rohmilchkäse dürfen Sie höchstens 36 Stunden lagern.'
  },
  { q: 'Wie lange dürfen Sie thermisierte Milch höchstens lagern?',
    options: ['36 Stunden', '48 Stunden', 'bis 3 Tage', '1 Woche'],
    correct: 1,
    explanation: 'Thermisierte Milch (leicht erhitzt) dürfen Sie höchstens 48 Stunden lagern.'
  },
  { q: 'Wie lange dürfen Sie pasteurisierte Milch höchstens lagern?',
    options: ['24 Stunden', '36 Stunden', '48 Stunden', 'bis 3 Tage'],
    correct: 3,
    explanation: 'Pasteurisierte Milch dürfen Sie bis 3 Tage lagern. Sie hat am wenigsten Keime.'
  },
  { q: 'Wo ist der Fettgehalt im Käse vorgeschrieben?',
    options: ['Im Gesetz und bei den Sortenorganisationen', 'Nur auf der Verpackung', 'Nur im Notizbuch des Käsers', 'Nirgends'],
    correct: 0,
    explanation: 'Der Fettgehalt steht im Gesetz (VLtH-Verordnung) und in den Anforderungen der Sortenorganisationen. Auch in Verträgen.'
  },
  { q: 'Was beeinflusst die Zusammensetzung der Milch?',
    options: ['Die Grösse vom Milchtank', 'Fütterung, Laktation und Genetik', 'Die Farbe der Kühe', 'Die Uhrzeit beim Abliefern'],
    correct: 1,
    explanation: 'Fütterung (Futter), Laktation (Zeit seit dem Kalben) und Genetik (Rasse) verändern die Milch.'
  },
  { q: 'Die Milch hat viel Kasein (Eiweiss). Was gilt dann für das Fett?',
    options: ['Die Milch braucht weniger Fett.', 'Die Milch braucht auch mehr Fett.', 'Das Fett spielt keine Rolle.', 'Man entfernt das ganze Fett.'],
    correct: 1,
    explanation: 'Im Käse muss das Verhältnis von Fett zu Kasein stimmen. Viel Kasein braucht auch mehr Fett.'
  },
  { q: 'Was ist eine Ursache für Käsestaub?',
    options: ['Zu kalte Lagerung der Milch', 'Schlechte Labfähigkeit der Milch', 'Zu viel Salz im Salzbad', 'Eine zu lange Reifung'],
    correct: 1,
    explanation: 'Käsestaub entsteht bei schlechter Labfähigkeit der Milch. Er entsteht auch bei fehlerhafter Bruchbereitung.'
  },
  { q: 'Was bewirkt Käsestaub?',
    options: ['Mehr Fett geht mit der Sirte verloren.', 'Der Käse bekommt mehr Löcher.', 'Der Käse wird salziger.', 'Die Rinde wird dicker.'],
    correct: 0,
    explanation: 'Der Käsestaub geht mit der Sirte weg. Dabei geht auch mehr Fett verloren.'
  },
  { q: 'Bei Pastmilchkäse gibt man Sirtenrahm in die Milch. Warum?',
    options: ['Damit der Käse mehr Löcher bekommt', 'Damit die Milch schneller gerinnt', 'Damit der Milchrahm für den Verkauf frei wird', 'Damit der Käse weniger Salz aufnimmt'],
    correct: 2,
    explanation: 'Mit Sirtenrahm fettet man die Milch auf. So kann man mehr Fett aus der Milch entziehen. Der Milchrahm bringt im Verkauf oft einen höheren Preis.'
  }
];

QuizEngine.init({
  questions: ALL_QUESTIONS,
  messages: {
    excellent: 'Ausgezeichnet! Sie wissen, wie Sie Käsereimilch richtig lagern.',
    good: 'Gut gemacht! Noch ein paar Fragen üben und Sie sind top.',
    ok: 'Nicht schlecht. Schauen Sie das Arbeitsblatt nochmals an.',
    poor: 'Schauen Sie das Arbeitsblatt nochmals an. Dann klappt es besser.'
  }
});
</script>
<footer class="bzwu-footer">
  BZWU Wil-Uzwil · Milchpraktiker EBA · Philipp Neukomm
</footer>

</body>
</html>
