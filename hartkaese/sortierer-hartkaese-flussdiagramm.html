<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hartkäse - Flussdiagramm</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    .fd-wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 16px 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Modus-Umschalter */
    .mode-switch {
      display: inline-flex;
      background: var(--surface);
      border-radius: 999px;
      padding: 4px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 18px;
    }
    .mode-btn {
      font-family: var(--font);
      font-size: 0.88rem;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 9px 18px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .mode-btn.active { background: var(--blue-dark); color: #fff; }

    .task-intro {
      background: var(--surface);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      padding: 14px 20px;
      font-size: 0.88rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 20px;
      width: 100%;
      line-height: 1.55;
    }

    /* Wortbank */
    .bank {
      position: sticky;
      top: 8px;
      z-index: 5;
      width: 100%;
      background: var(--surface);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      padding: 12px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      min-height: 54px;
    }
    .bank.empty::after {
      content: 'Alle Schritte sind platziert. Jetzt überprüfen.';
      font-size: 0.85rem;
      color: var(--text-subtle);
      align-self: center;
    }
    .chip {
      font-family: var(--font);
      font-size: 0.82rem;
      font-weight: 500;
      padding: 7px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--blue-light);
      background: var(--blue-tint);
      color: var(--blue-dark);
      cursor: grab;
      user-select: none;
      transition: transform 0.1s, background 0.15s;
    }
    .chip:hover { transform: translateY(-1px); }
    .chip.selected { background: var(--blue-dark); color: #fff; border-color: var(--blue-dark); }

    .help-list {
      width: 100%;
      font-size: 0.82rem;
      color: var(--text-muted);
      background: var(--surface);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      padding: 10px 16px;
      margin-bottom: 20px;
      line-height: 1.7;
      display: none;
    }

    /* Flussdiagramm */
    .flow {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .terminal {
      background: var(--blue-dark);
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 12px 28px;
      border-radius: 999px;
      box-shadow: var(--shadow-md);
      text-align: center;
    }
    .arrow {
      width: 2px;
      height: 22px;
      background: var(--text-subtle);
      position: relative;
      flex-shrink: 0;
    }
    .arrow::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: -5px;
      border: 6px solid transparent;
      border-top: 7px solid var(--text-subtle);
      border-bottom: none;
    }

    .phase-label {
      align-self: flex-start;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 6px 0 4px;
    }

    .step-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .step {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
      border: 2px dashed var(--border);
      border-left: 6px solid var(--phase);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      min-height: 56px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s, background 0.2s, transform 0.1s;
    }
    .step.filled { border-style: solid; border-color: var(--border); border-left-color: var(--phase); }
    .step.drag-over, .step.target { background: var(--blue-tint); border-color: var(--blue-light); border-left-color: var(--phase); }
    .step.is-correct { background: #f0fdf4; border-color: #38a169; border-style: solid; border-left-color: #38a169; }
    .step.is-wrong   { background: #fff5f5; border-color: var(--red); border-style: solid; border-left-color: var(--red); }

    .num {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--phase);
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .slot-text {
      flex: 1;
      font-size: 0.9rem;
      line-height: 1.4;
      color: var(--text);
    }
    .slot-text.placeholder { color: var(--text-subtle); font-style: italic; }
    .slot-input {
      flex: 1;
      font-family: var(--font);
      font-size: 0.9rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      background: var(--bg);
      color: var(--text);
      min-width: 0;
    }
    .slot-input:focus { outline: 2px solid var(--blue-light); background: #fff; }
    .solution {
      display: block;
      font-size: 0.78rem;
      color: var(--red-dark);
      margin-top: 4px;
    }

    /* Zugabe von der Seite (Kulturen, Lab) */
    .side-input {
      width: 92px;
      flex-shrink: 0;
      font-size: 0.75rem;
      font-weight: 600;
      color: #854d0e;
      background: #fef9c3;
      border: 1.5px solid #fde68a;
      border-radius: var(--radius-sm);
      padding: 6px 8px;
      text-align: center;
      position: relative;
    }
    .side-input::before {
      content: '';
      position: absolute;
      left: -10px;
      top: 50%;
      width: 10px;
      height: 2px;
      background: #fde68a;
    }
    .side-spacer { width: 92px; flex-shrink: 0; }

    .result-msg {
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      color: var(--text-muted);
      min-height: 1.4em;
      margin: 22px 0 14px;
    }
    .result-msg.success { color: #15803d; }

    .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

    @media (max-width: 520px) {
      .side-input, .side-spacer { width: 64px; font-size: 0.68rem; }
      .step { padding: 8px 10px; gap: 8px; }
    }
  </style>
</head>
<body>

<header class="bzwu-header">
  <div class="header-text">
    <span class="school-badge">BZWU Wil-Uzwil · Milchpraktiker EBA · Hartkäse</span>
    <h1>Hartkäse - Flussdiagramm</h1>
    <p>Von der Rohmilch bis zum Hartkäse: 10 Schritte.</p>
  </div>
  <div class="header-logos">
    <img src="../assets/logos/bzwu.png" alt="BZWU" class="header-logo">
    <img src="../assets/logos/milchtechnologen.svg" alt="Milchtechnologen" class="header-logo">
  </div>
</header>

<main>
<div class="fd-wrap">
  <a class="back-link" href="../index.html">&#8592; Alle Lerntools</a>

  <div class="mode-switch">
    <button class="mode-btn active" id="btnZiehen" onclick="setMode('ziehen')">Ziehen</button>
    <button class="mode-btn" id="btnTippen" onclick="setMode('tippen')">Selbst eintragen</button>
  </div>

  <div class="task-intro" id="intro"></div>

  <div class="bank" id="bank"></div>
  <div class="help-list" id="helpList"></div>

  <div class="flow" id="flow"></div>

  <div class="result-msg" id="resultMsg"></div>
  <div class="actions" id="actions"></div>
</div>
</main>

<script>
// Reihenfolge und Wortlaut wie LS_hartkaese_03_flussdiagramm.md (Lehrmittel EBA Hartkäse S. 6)
var PHASES = {
  milch:   { label: 'Milch vorbereiten',     color: '#69A9C9' },
  kessi:   { label: 'Im Käsekessi',          color: '#134061' },
  formen:  { label: 'Formen',                color: '#15803d' },
  reifung: { label: 'Salzen und reifen',     color: '#b45309' }
};

// keys: Wortteile, die beim Eintippen als richtig gelten; not: Wortteile, die es falsch machen
var STEPS = [
  { id: 1,  text: 'Milch vorbehandeln, Fettgehalt einstellen', phase: 'milch',   keys: ['vorbehand', 'fett', 'standard'] },
  { id: 2,  text: 'Kulturen zugeben, vorreifen',              phase: 'milch',   keys: ['kultur', 'vorreif'], side: '+ Kulturen' },
  { id: 3,  text: 'Lab zugeben, gerinnen',                    phase: 'kessi',   keys: ['lab', 'gerinn'], side: '+ Lab' },
  { id: 4,  text: 'Gallerte schneiden, Bruch bereiten',       phase: 'kessi',   keys: ['schneid', 'gallerte', 'bruch bereit', 'bruchbereit'] },
  { id: 5,  text: 'Bruch wärmen, ausrühren',                  phase: 'kessi',   keys: ['waerm', 'warm', 'ausruehr', 'ruehr'] },
  { id: 6,  text: 'Bruch abfüllen',                           phase: 'formen',  keys: ['abfuell', 'fuell'] },
  { id: 7,  text: 'Pressen',                                  phase: 'formen',  keys: ['press'] },
  { id: 8,  text: 'Milchzucker vergären',                     phase: 'reifung', keys: ['milchzucker', 'gaer', 'laktose'] },
  { id: 9,  text: 'Salzbehandlung (Salzbad)',                 phase: 'reifung', keys: ['salz'] },
  { id: 10, text: 'Reifen',                                   phase: 'reifung', keys: ['reif'], not: ['vorreif'] }
];

var mode = 'ziehen';
var placed = {};      // slotId -> stepId (Modus Ziehen)
var selectedChip = null;

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function fold(s) {
  return s.toLowerCase()
    .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue')
    .replace(/\s+/g, ' ').trim();
}

function stepById(id) {
  for (var i = 0; i < STEPS.length; i++) if (STEPS[i].id === id) return STEPS[i];
  return null;
}

function setMode(m) {
  mode = m;
  document.getElementById('btnZiehen').classList.toggle('active', m === 'ziehen');
  document.getElementById('btnTippen').classList.toggle('active', m === 'tippen');
  build();
}

function build() {
  placed = {};
  selectedChip = null;
  var intro = document.getElementById('intro');
  var bank = document.getElementById('bank');
  var help = document.getElementById('helpList');
  var actions = document.getElementById('actions');
  var msg = document.getElementById('resultMsg');
  msg.textContent = '';
  msg.className = 'result-msg';

  if (mode === 'ziehen') {
    intro.innerHTML = 'Ziehen Sie jeden Schritt in das richtige Feld.<br>' +
      'Auf dem Handy: Schritt antippen, dann das Feld antippen. Feld nochmals antippen = Schritt zurück.';
    bank.style.display = 'flex';
    help.style.display = 'none';
    buildBank();
    actions.innerHTML =
      '<button class="btn btn-primary" onclick="check()">Überprüfen</button>' +
      '<button class="btn btn-ghost" onclick="build()">&#8635; Neu mischen</button>';
  } else {
    intro.innerHTML = 'Schreiben Sie in jedes Feld den richtigen Schritt.<br>' +
      'Es reicht ein Stichwort, z. B. «Pressen». Die Rechtschreibung muss nicht perfekt sein.';
    bank.style.display = 'none';
    help.innerHTML = '<b>Wörter zur Hilfe:</b> ' + shuffle(STEPS).map(function(s) { return s.text; }).join(' · ');
    help.style.display = 'none';
    actions.innerHTML =
      '<button class="btn btn-primary" onclick="check()">Überprüfen</button>' +
      '<button class="btn btn-ghost" onclick="toggleHelp()">Hilfe anzeigen</button>' +
      '<button class="btn btn-ghost" onclick="build()">&#8635; Leeren</button>';
  }
  buildFlow();
}

function toggleHelp() {
  var help = document.getElementById('helpList');
  help.style.display = help.style.display === 'block' ? 'none' : 'block';
}

function buildBank() {
  var bank = document.getElementById('bank');
  bank.innerHTML = '';
  var used = {};
  for (var k in placed) used[placed[k]] = true;
  shuffle(STEPS).forEach(function(step) {
    if (used[step.id]) return;
    var chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = step.text;
    chip.dataset.id = step.id;
    chip.draggable = true;
    chip.onclick = function() {
      if (selectedChip) selectedChip.classList.remove('selected');
      if (selectedChip === chip) { selectedChip = null; return; }
      selectedChip = chip;
      chip.classList.add('selected');
    };
    chip.addEventListener('dragstart', function(e) {
      e.dataTransfer.setData('text/plain', String(step.id));
      e.dataTransfer.effectAllowed = 'move';
    });
    bank.appendChild(chip);
  });
  bank.classList.toggle('empty', bank.children.length === 0);
}

function buildFlow() {
  var flow = document.getElementById('flow');
  flow.innerHTML = '<div class="terminal">Rohmilch</div>';
  var lastPhase = null;

  STEPS.forEach(function(step) {
    var ph = PHASES[step.phase];
    flow.insertAdjacentHTML('beforeend', '<div class="arrow"></div>');
    if (step.phase !== lastPhase) {
      flow.insertAdjacentHTML('beforeend',
        '<div class="phase-label" style="color:' + ph.color + '">' + ph.label + '</div>');
      lastPhase = step.phase;
    }

    var row = document.createElement('div');
    row.className = 'step-row';

    var box = document.createElement('div');
    box.className = 'step';
    box.id = 'slot-' + step.id;
    box.style.setProperty('--phase', ph.color);

    var num = '<span class="num">' + step.id + '</span>';
    if (mode === 'ziehen') {
      box.innerHTML = num + '<span class="slot-text placeholder">Schritt hierher ziehen</span>';
      box.addEventListener('dragover', function(e) { e.preventDefault(); box.classList.add('drag-over'); });
      box.addEventListener('dragleave', function() { box.classList.remove('drag-over'); });
      box.addEventListener('drop', function(e) {
        e.preventDefault();
        box.classList.remove('drag-over');
        place(step.id, parseInt(e.dataTransfer.getData('text/plain'), 10));
      });
      box.onclick = function() {
        if (selectedChip) {
          place(step.id, parseInt(selectedChip.dataset.id, 10));
        } else if (placed[step.id]) {
          delete placed[step.id];
          renderSlot(step.id);
          buildBank();
        }
      };
    } else {
      box.innerHTML = num + '<div style="flex:1;min-width:0"><input class="slot-input" type="text" ' +
        'autocomplete="off" placeholder="Schritt ' + step.id + '" id="input-' + step.id + '"></div>';
    }

    row.innerHTML = '<div class="side-spacer"></div>';
    row.appendChild(box);
    if (step.side) {
      row.insertAdjacentHTML('beforeend', '<div class="side-input">' + step.side + '</div>');
    } else {
      row.insertAdjacentHTML('beforeend', '<div class="side-spacer"></div>');
    }
    flow.appendChild(row);
  });

  flow.insertAdjacentHTML('beforeend', '<div class="arrow"></div><div class="terminal">Extra-, Hartkäse</div>');
}

function place(slotId, stepId) {
  if (!stepId) return;
  // Schritt war schon in einem anderen Feld: dort entfernen
  for (var k in placed) if (placed[k] === stepId) { delete placed[k]; renderSlot(parseInt(k, 10)); }
  placed[slotId] = stepId;
  selectedChip = null;
  renderSlot(slotId);
  buildBank();
  clearFeedback();
}

function renderSlot(slotId) {
  var box = document.getElementById('slot-' + slotId);
  var txt = box.querySelector('.slot-text');
  box.classList.remove('is-correct', 'is-wrong');
  if (placed[slotId]) {
    txt.textContent = stepById(placed[slotId]).text;
    txt.classList.remove('placeholder');
    box.classList.add('filled');
  } else {
    txt.textContent = 'Schritt hierher ziehen';
    txt.classList.add('placeholder');
    box.classList.remove('filled');
  }
}

function clearFeedback() {
  document.querySelectorAll('.step').forEach(function(b) { b.classList.remove('is-correct', 'is-wrong'); });
  var msg = document.getElementById('resultMsg');
  msg.textContent = '';
  msg.className = 'result-msg';
}

function isTypedCorrect(step, value) {
  var v = fold(value);
  if (!v) return false;
  if (step.not && step.not.some(function(n) { return v.indexOf(n) !== -1; })) return false;
  return step.keys.some(function(k) { return v.indexOf(k) !== -1; });
}

function check() {
  var correct = 0;
  STEPS.forEach(function(step) {
    var box = document.getElementById('slot-' + step.id);
    var ok;
    if (mode === 'ziehen') {
      if (!placed[step.id]) { box.classList.remove('is-correct', 'is-wrong'); return; }
      ok = placed[step.id] === step.id;
    } else {
      var input = document.getElementById('input-' + step.id);
      var old = box.querySelector('.solution');
      if (old) old.remove();
      ok = isTypedCorrect(step, input.value);
      if (!ok) {
        input.insertAdjacentHTML('afterend', '<span class="solution">Richtig wäre: ' + step.text + '</span>');
      }
    }
    box.classList.toggle('is-correct', ok);
    box.classList.toggle('is-wrong', !ok);
    if (ok) correct++;
  });

  var msg = document.getElementById('resultMsg');
  if (correct === STEPS.length) {
    msg.textContent = 'Perfekt! Alle 10 Schritte sind richtig.';
    msg.className = 'result-msg success';
  } else if (mode === 'ziehen' && Object.keys(placed).length < STEPS.length) {
    msg.textContent = correct + ' von 10 richtig. Es fehlen noch ' + (STEPS.length - Object.keys(placed).length) + ' Schritte.';
    msg.className = 'result-msg';
  } else {
    msg.textContent = correct + ' von 10 richtig. Rot = noch nicht richtig.' +
      (mode === 'ziehen' ? ' Rote Felder antippen und neu platzieren.' : '');
    msg.className = 'result-msg';
  }
}

build();
</script>
<footer class="bzwu-footer">
  BZWU Wil-Uzwil · Milchpraktiker EBA · Philipp Neukomm
</footer>

</body>
</html>
