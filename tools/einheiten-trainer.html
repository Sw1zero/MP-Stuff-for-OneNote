  { von: 'm³', nach: 'cm³', kat: 4, werte: [0.001, 0.0025, 0.005, 0.01, 0.025, 0.05], faktor: 1000000, regel: '1 m³ = 1000000 cm³, also × 1000000' }

// Ein Generator pro Kategorie, der eine zufällige Umrechnung dieser Kategorie stellt
function generator(kat) {
  return function () {
    var u = Rechner.pick(UMRECHNUNGEN.filter(function (x) { return x.kat === kat; }));
    var w = Rechner.pick(u.werte);
    if (Math.random() < 0.5) { // Hälfte der Aufgaben: Zufallswert mit 3 gültigen Ziffern im Bereich der Liste (z.B. 3.47 oder 32.4)
      var lo = Math.min.apply(null, u.werte), hi = Math.max.apply(null, u.werte);
      w = parseFloat((lo + Math.random() * (hi - lo)).toPrecision(3));
    }
    var e = parseFloat((w * u.faktor).toPrecision(9));
    return {
      text: 'Rechnen Sie um: <strong>' + Rechner.zahl(w) + ' ' + u.von + '</strong> = ? ' + u.nach,
      felder: [{ label: 'Ergebnis', einheit: u.nach, wert: e, tol: 0 }],
      weg: [u.regel, Rechner.zahl(w) + ' ' + u.von + ' = <strong>' + Rechner.zahl(e) + ' ' + u.nach + '</strong>']
    };
  };
}

// Längen mit gemischten Einheiten malnehmen: Fläche (2 Längen) oder Raummass (3 Längen), Ergebnis in vorgegebener Einheit
var LAENGE = { m: { fak: 100, min: 0.5, max: 5 }, dm: { fak: 10, min: 5, max: 50 }, cm: { fak: 1, min: 20, max: 200 } };
function berechnen(n) {
  return function () {
    var ziel = Rechner.pick(['m', 'dm', 'cm']), hoch = n === 2 ? '²' : '³', teile = [], prod = 1, schritte = [], umr = [];
    for (var i = 0; i < n; i++) {
      var e = Rechner.pick(['m', 'dm', 'cm']), L = LAENGE[e];
      var w = parseFloat((L.min + Math.random() * (L.max - L.min)).toPrecision(3));
      var im = parseFloat((w * L.fak / LAENGE[ziel].fak).toPrecision(9));
      teile.push(w + ' ' + e); schritte.push(Rechner.zahl(im));
      if (e !== ziel) umr.push(Rechner.zahl(w) + ' ' + e + ' = ' + Rechner.zahl(im) + ' ' + ziel);
      prod *= im;
    }
    prod = parseFloat(prod.toPrecision(9));
    return {
      text: 'Wie viel <strong>' + ziel + hoch + '</strong> sind <strong>' + teile.map(function (t) { return Rechner.zahl(parseFloat(t)) + ' ' + t.split(' ')[1]; }).join(' × ') + '</strong>?',
      felder: [{ label: 'Ergebnis', einheit: ziel + hoch, wert: prod, tol: Math.abs(prod) * 0.005 }],
      weg: (umr.length ? ['Alles in ' + ziel + ' umrechnen: ' + umr.join(', ')] : []).concat([schritte.join(' × ') + ' = <strong>' + Rechner.zahl(prod) + ' ' + ziel + hoch + '</strong>'])
    };
  };
}

Rechner.init({

    { name: 'Raummass', aufgaben: [generator(4)] },
    { name: 'Fläche berechnen', aufgaben: [berechnen(2)] },
