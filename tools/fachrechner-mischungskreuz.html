<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mischungskreuz Hartkäse – Fachrechner</title>
  <link rel="stylesheet" href="../style.css?v=9d4bf0bd">
</head>
<body>

<header class="bzwu-header">
  <div class="header-text">
  <span class="school-badge">BZWU Wil-Uzwil · Milchpraktiker EBA · Rechner</span>
  <h1>Mischungskreuz</h1>
  <p>Vollmilch und Magermilch mischen. So stellen Sie den Fettgehalt der Käsereimilch ein.</p>
  </div>
  <div class="header-logos">
    <img src="../assets/logos/bzwu.png" alt="BZWU" class="header-logo">
    <img src="../assets/logos/milchtechnologen.svg" alt="Milchtechnologen" class="header-logo">
  </div>
</header>

<main class="page-main">
  <a class="back-link" href="../index.html">← Alle Lerntools</a>
  <div id="mischungskreuz"></div>
</main>

<footer class="bzwu-footer">
  BZWU Wil-Uzwil · Milchpraktiker EBA · Philipp Neukomm
</footer>

<script src="../assets/rechner.js?v=bd0a754c"></script>
<script src="../assets/mischungskreuz.js?v=2e9d7f15"></script>
<script>
var pick = Rechner.pick, z = Rechner.zahl;

var Q_VOLL  = [3.8, 3.9, 4.0, 4.1, 4.2];
var Q_MAGER = [0.03, 0.05, 0.1];
var Q_ZIEL  = [2.8, 2.9, 3.0, 3.1, 3.2, 3.4, 3.6];
var Q_MENGE = [500, 800, 1000, 1200, 1500, 2000];

function genFett() {
  var a = pick(Q_VOLL), b = pick(Q_MAGER), c = pick(Q_ZIEL), M = pick(Q_MENGE);
  return Mischungskreuz.aufgabe({ nameA: 'Vollmilch', a: a, nameB: 'Magermilch', b: b, c: c, gesucht: 'mengen', menge: M,
    text: 'Sie brauchen <strong>' + z(M) + ' kg</strong> Käsereimilch mit <strong>' + z(c) + ' %</strong> Fett. Die Vollmilch hat <strong>' +
      z(a) + ' %</strong> Fett, die Magermilch <strong>' + z(b) + ' %</strong>. Wie viel kg Vollmilch und wie viel kg Magermilch brauchen Sie?' });
}

function genAnteil() {
  var a = pick(Q_VOLL), b = pick(Q_MAGER), c = pick(Q_ZIEL);
  return Mischungskreuz.aufgabe({ nameA: 'Vollmilch', a: a, nameB: 'Magermilch', b: b, c: c, gesucht: 'anteile',
    text: 'Sie mischen Vollmilch (<strong>' + z(a) + ' %</strong> Fett) und Magermilch (<strong>' + z(b) + ' %</strong> Fett) zu Käsereimilch mit <strong>' +
      z(c) + ' %</strong> Fett. Wie viel Prozent der Mischung sind Vollmilch, wie viel Magermilch?' });
}

Mischungskreuz.seite({
  uebung: {
    kategorien: [
      { name: 'Mengen', aufgaben: [genFett] },
      { name: 'Anteile in %', aufgaben: [genAnteil] }
    ],
  hilfe: { titel: 'So geht das Mischungskreuz', html:
    '<ol><li>Links oben Komponente A mit ihrem Wert, links unten Komponente B.</li>' +
    '<li>In die Mitte den Zielwert.</li>' +
    '<li>Über Kreuz rechnen, immer grosse minus kleine Zahl. Rechts stehen die Teile.</li>' +
    '<li>Teile zusammenzählen: Gesamtteile.</li>' +
    '<li>Menge = Teile ÷ Gesamtteile × Gesamtmenge.</li></ol>' +
    '<p>Der Zielwert liegt immer zwischen den beiden Werten.</p>' }
  },
  rechner: { vorlagen: [{ titel: 'Käsereimilch für Emmentaler', nameA: 'Vollmilch', a: 4.0, nameB: 'Magermilch', b: 0.05, c: 3.0, menge: 1000 }] }
});
</script>
</body>
</html>
