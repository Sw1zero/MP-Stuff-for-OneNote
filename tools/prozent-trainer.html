<script src="../assets/rechner.js?v=5fca8161"></script>
<script>
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
var fmtN = Rechner.zahl;

// ── Task generators ──────────────────────────────────────────────────────────

function genProzentwert() {
  var mengen = [500, 800, 1000, 1200, 1500, 2000, 2500, 3000, 4000, 5000];
  var pcts   = [5, 8, 10, 12, 15, 18, 20, 25];
  var ganzes = pick(mengen), pct = pick(pcts);
  var teil   = ganzes * pct / 100;
  return {
    text: 'Sie stellen <strong>' + fmtN(ganzes) + ' g</strong> Fruchtquark mit <strong>' + pct + ' % Fruchtanteil</strong> her. Wie viel g Fruchtgrundstoff brauchen Sie?',
    felder: [{ einheit: 'g', wert: teil }],
    weg: [
      'Teil = Ganzes × Anteil % ÷ 100',
      'Frucht = ' + fmtN(ganzes) + ' g × ' + pct + ' ÷ 100 = <strong>' + fmtN(teil) + ' g</strong>'
    ]
  };
}

function genFruchtZuQuark() {
  var quarks = [100, 120, 150, 180, 200, 240, 250, 280, 300, 320, 350, 400,
                420, 450, 480, 500, 540, 560, 600, 640, 700, 720, 750, 800,
                840, 900, 960, 1000, 1200, 1500, 2000];
  var pcts   = [5, 8, 10, 12, 15, 18, 20, 22, 25, 30];
  var quark  = pick(quarks);
  var pct    = pick(pcts);
  var frucht = quark * pct / (100 - pct);
  return {
    text: 'Sie haben <strong>' + fmtN(quark) + ' g</strong> Magerquark und möchten eine Mischung mit <strong>' + pct + ' % Fruchtanteil</strong> herstellen. Wie viel Fruchtgrundstoff benötigen Sie?',
    felder: [{ einheit: 'g', wert: frucht }],
    weg: [
      'Der Quark ist der Rest der Mischung: 100 % − ' + pct + ' % = <strong>' + (100 - pct) + ' %</strong>',
      'Frucht = ' + fmtN(quark) + ' g × ' + pct + ' ÷ ' + (100 - pct) + ' = <strong>' + fmtN(frucht) + ' g</strong>'
    ]
  };
}

function genProzentsatz() {
  var totals = [200, 250, 300, 400, 500, 600, 750, 800, 1000, 1200, 1500, 2000];
  var pcts   = [2, 3, 4, 5, 6, 8, 10, 12, 15, 18, 20, 25];
  var total, pct, teil, tries = 0;
  do {
    total = pick(totals);
    pct   = pick(pcts);
    teil  = total * pct / 100;
    tries++;
  } while (tries < 50 && Math.round(teil * 10) !== teil * 10);
  return {
    text: 'In einem Eimer befinden sich <strong>' + fmtN(total) + ' g</strong> einer fertigen Mischung. Davon sind laut Deklaration <strong>' + fmtN(teil) + ' g</strong> reiner Zucker. Wie hoch ist der Zuckeranteil in Prozent?',
    felder: [{ einheit: '%', wert: pct }],
    weg: [
      'Zuckeranteil = Zucker ÷ Gesamtmischung × 100',
      'Zuckeranteil = ' + fmtN(teil) + ' g ÷ ' + fmtN(total) + ' g × 100 = <strong>' + pct + ' %</strong>'
    ]
  };
}

function genGrundwert() {
  var fruchts = [50, 60, 75, 80, 90, 100, 120, 125, 150, 160, 175, 180, 200,
                 225, 240, 250, 270, 300, 320, 360, 375, 400, 450, 480, 500,
                 600, 625, 750, 800];
  var pcts    = [5, 8, 10, 12, 15, 20, 25];
  var frucht, pct, total, tries = 0;
  do {
    frucht = pick(fruchts);
    pct    = pick(pcts);
    total  = frucht * 100 / pct;
    tries++;
  } while (tries < 100 && Math.round(total) !== total);
  if (tries >= 100) { frucht = 250; pct = 10; total = 2500; }
  return {
    text: 'Sie haben noch <strong>' + fmtN(frucht) + ' g</strong> Fruchtgrundstoff. Ihr Rezept sieht einen Fruchtanteil von <strong>' + pct + ' %</strong> vor. Wie viel fertige Mischung können Sie damit herstellen?',
    felder: [{ einheit: 'g', wert: total }],
    weg: [
      'Gesamtmenge = Frucht ÷ Fruchtanteil × 100',
      'Gesamtmenge = ' + fmtN(frucht) + ' g ÷ ' + pct + ' × 100 = <strong>' + fmtN(total) + ' g</strong>'
    ]
  };
}

var MISCHUNG_TASKS = [
  {quark:200, start:10, target:4},  {quark:250, start:8,  target:4},
  {quark:250, start:12, target:6},  {quark:300, start:5,  target:3},
  {quark:300, start:8,  target:4},  {quark:300, start:12, target:4},
  {quark:300, start:20, target:6},  {quark:400, start:5,  target:2},
  {quark:400, start:8,  target:4},  {quark:400, start:10, target:5},
  {quark:400, start:15, target:5},  {quark:400, start:20, target:10},
  {quark:500, start:4,  target:2},  {quark:500, start:6,  target:3},
  {quark:500, start:8,  target:4},  {quark:500, start:10, target:4},
  {quark:500, start:12, target:6},  {quark:500, start:15, target:5},
  {quark:500, start:20, target:4},  {quark:600, start:5,  target:3},
  {quark:600, start:10, target:4},  {quark:600, start:12, target:8},
  {quark:600, start:15, target:6},  {quark:600, start:15, target:10},
  {quark:600, start:20, target:5},  {quark:750, start:8,  target:4},
  {quark:800, start:5,  target:4},  {quark:800, start:10, target:8},
  {quark:1000,start:8,  target:4},  {quark:1200,start:10, target:4}
];

function genMischung() {
  var t      = pick(MISCHUNG_TASKS);
  var zucker = t.quark * t.start / 100;
  var end    = zucker * 100 / t.target;
  return {
    text: 'Sie haben <strong>' + fmtN(t.quark) + ' g</strong> Magerquark mit <strong>' + t.start + ' % Zuckergehalt</strong> (= ' + fmtN(zucker) + ' g Zucker). Sie möchten den Zuckergehalt durch Zugabe von reinem Magerquark auf <strong>' + t.target + ' %</strong> senken. Wie schwer muss die fertige Mischung sein?',
    felder: [{ einheit: 'g', wert: end }],
    weg: [
      'Der Zucker bleibt gleich: <strong>' + fmtN(zucker) + ' g</strong>',
      'Endgewicht = ' + fmtN(zucker) + ' g ÷ ' + t.target + ' × 100 = <strong>' + fmtN(end) + ' g</strong>'
    ]
  };
}

var ANTEIL_TASKS = [
  // Gesamtmasse 500 g
  {quark:200, frucht:50,  zucker:250}, {quark:225, frucht:50,  zucker:225},
  {quark:300, frucht:50,  zucker:150}, {quark:350, frucht:50,  zucker:100},
  {quark:400, frucht:50,  zucker:50},  {quark:175, frucht:75,  zucker:250},
  {quark:225, frucht:75,  zucker:200}, {quark:300, frucht:75,  zucker:125},
  {quark:350, frucht:75,  zucker:75},  {quark:175, frucht:100, zucker:225},
  {quark:200, frucht:100, zucker:200}, {quark:250, frucht:100, zucker:150},
  {quark:300, frucht:100, zucker:100}, {quark:350, frucht:100, zucker:50},
  {quark:200, frucht:125, zucker:175}, {quark:250, frucht:125, zucker:125},
  {quark:200, frucht:150, zucker:150}, {quark:250, frucht:150, zucker:100},
  {quark:300, frucht:150, zucker:50},  {quark:250, frucht:200, zucker:50},
  // Gesamtmasse 1000 g
  {quark:500, frucht:100, zucker:400}, {quark:600, frucht:100, zucker:300},
  {quark:700, frucht:100, zucker:200}, {quark:800, frucht:100, zucker:100},
  {quark:500, frucht:150, zucker:350}, {quark:600, frucht:150, zucker:250},
  {quark:700, frucht:150, zucker:150}, {quark:750, frucht:150, zucker:100},
  {quark:500, frucht:200, zucker:300}, {quark:600, frucht:200, zucker:200},
  {quark:700, frucht:200, zucker:100}, {quark:500, frucht:250, zucker:250},
  {quark:600, frucht:250, zucker:150}, {quark:650, frucht:250, zucker:100},
  // Gesamtmasse 800 g
  {quark:400, frucht:80,  zucker:320}, {quark:480, frucht:80,  zucker:240},
  {quark:560, frucht:80,  zucker:160}, {quark:480, frucht:160, zucker:160},
  {quark:400, frucht:200, zucker:200}, {quark:480, frucht:240, zucker:80}
];

function genAnteilMischung() {
  var t     = pick(ANTEIL_TASKS);
  var total = t.quark + t.frucht + t.zucker;
  var pct   = t.frucht / total * 100;
  return {
    text: 'Sie mischen <strong>' + fmtN(t.quark) + ' g</strong> Magerquark, <strong>' + fmtN(t.frucht) + ' g</strong> Fruchtgrundstoff und <strong>' + fmtN(t.zucker) + ' g</strong> Zucker. Wie hoch ist der prozentuale Anteil des Fruchtgrundstoffs an der Gesamtmasse?',
    felder: [{ einheit: '%', wert: pct }],
    weg: [
      'Gesamtmasse = ' + fmtN(t.quark) + ' + ' + fmtN(t.frucht) + ' + ' + fmtN(t.zucker) + ' = <strong>' + fmtN(total) + ' g</strong>',
      'Fruchtanteil = ' + fmtN(t.frucht) + ' ÷ ' + fmtN(total) + ' × 100 = <strong>' + fmtN(pct) + ' %</strong>'
    ]
  };
}

Rechner.init({
  kategorien: [
    { name: 'Prozentwert', aufgaben: [genProzentwert] },
    { name: 'Prozentsatz', aufgaben: [genProzentsatz, genAnteilMischung] },
    { name: 'Grundwert', aufgaben: [genGrundwert] },
    { name: 'Mischung', aufgaben: [genMischung, genFruchtZuQuark] }
  ],
  hilfe: { titel: 'Formeln', html:
    '<table class="r-tabelle"><tr><th>Gesucht</th><th>Formel</th></tr>' +
    '<tr><td>Prozentwert</td><td>Teil = Ganzes × Anteil % ÷ 100</td></tr>' +
    '<tr><td>Prozentsatz</td><td>Anteil % = Teil ÷ Ganzes × 100</td></tr>' +
    '<tr><td>Grundwert</td><td>Ganzes = Teil ÷ Anteil % × 100</td></tr>' +
    '<tr><td>Mischung</td><td>Endgewicht = Zucker ÷ Zielanteil % × 100</td></tr>' +
    '<tr><td>Frucht zum Quark</td><td>Frucht = Quark × Anteil % ÷ (100 − Anteil %)</td></tr></table>' }
});
</script>
